# Line coverage floors, one entry per workspace crate.
#
# CI's `coverage` job measures line coverage while it runs the tests, and
# scripts/check-coverage.py fails the job when a crate is under its floor, when a
# crate is missing from the report, or when an entry here is incomplete.
#
#   floor   The whole-number percentage of the crate's lines under src/ that the
#           tests must execute. 100 means every line.
#   branch_floor  The same for branches, measured by CI's `branches` job on a pinned
#           nightly (stable Rust cannot measure branches) and checked with
#           `check-coverage.py --branches`. A crate with no branches passes.
#   reason  One line saying why the floor is where it is.
#
# Floors only ratchet up. A change that raises a crate's coverage raises its floor
# in the same change, and lowering a floor needs a reason stated in review. There
# is no exclusion list: code that CI cannot exercise stays in the measurement and
# holds its crate's floor down where everyone can see it. See "Tests" in
# CONTRIBUTING.md.

[crates.bridgewatch-core]
floor = 100
branch_floor = 95
reason = "Every line, on the fourth coverage pull request (#138); branches as CI's branches job measured them there, 95.05% (1654 of 1740), rounded down."

[crates.bridgewatch-cli]
floor = 100
branch_floor = 93
reason = "Every line: CI measured 100.00% of lines (4129 of 4129) on the fourth coverage pull request (#138), and 93.98% of branches (297 of 316), rounded down."

[crates.bridgewatch-app]
floor = 70
branch_floor = 49
reason = "On the app coverage pull request (#141), merged with main at 6f259ed: CI measured 70.87% of lines (4253 of 6001) and 49.38% of branches (281 of 569), each rounded down. What is left needs a running desktop app (a window, the tray, a global shortcut, the run loop, OS services): docs/coverage.md lists it per file, and #143 tracks it."
