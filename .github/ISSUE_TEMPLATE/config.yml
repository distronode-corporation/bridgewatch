# No blank issues: everything goes through the structured Bug report form, or one of
# the links below. Keeps the tracker to real, reproducible bugs instead of setup
# questions, which for a tray app are mostly "my token is not being found".
#
# ⚠️ The Discussions link needs Discussions ENABLED on the repository (Settings ->
# Features). With blank issues off and Discussions off there is nowhere for a
# question to go.
blank_issues_enabled: false
contact_links:
  - name: 📖 README
    url: https://github.com/distronode-corporation/bridgewatch#readme
    about: Configuration, token sources, the verdict rules and what each tray state means. Most questions are answered here, so please check first.
  - name: 💬 Questions and ideas
    url: https://github.com/distronode-corporation/bridgewatch/discussions
    about: For "how do I…", credential trouble or feature ideas. The issue tracker is for confirmed bugs only.
  - name: 🔒 Security report
    url: https://github.com/distronode-corporation/bridgewatch/security/advisories/new
    about: Please do not open a public issue for a vulnerability. Report it privately here (see SECURITY.md); bridgewatch holds a GitLab or GitHub token, so a report that leaks before a fix is worse than the bug.
