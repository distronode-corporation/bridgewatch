name: Release

# Fires on a `vX.Y.Z` tag and produces the ten assets a user can install: one
# universal macOS .dmg (Apple Silicon and Intel in one binary), a .deb, an .rpm and
# an .AppImage for each of Linux x86_64 and arm64, and the `bridgewatch` CLI as three
# tarballs, `bridgewatch-cli_<version>_<target>.tar.gz` for universal-apple-darwin,
# x86_64-unknown-linux-gnu and aarch64-unknown-linux-gnu. Windows is not targeted. An
# eleventh file, `bridgewatch_<version>.intoto.jsonl`, is the signed provenance
# attestation over all ten, attached so it can be verified offline and found by
# OpenSSF Scorecard. Once the release is public, the `npm` job (off until
# vars.NPM_PUBLISH is 'true') publishes the same three CLI binaries as the
# `bridgewatch` npm package.
#
# Every bundle carries LICENSE, NOTICE and the licence texts of the third-party code
# linked into it: THIRD-PARTY-LICENSES-rust.txt (cargo-about over Cargo.lock) and
# THIRD-PARTY-LICENSES-npm.txt (the npm packages the frontend build kept). Both are
# generated by the `licenses` job and added to the bundle through
# src-tauri/tauri.licenses.conf.json, which only this workflow passes, because the
# files exist only here. Each CLI tarball carries LICENSE, NOTICE and
# THIRD-PARTY-LICENSES-cli.txt, a second cargo-about run over the CLI crate alone (the
# app's run does not see clap and the other crates only the CLI links).
#
# ⛔ THE RELEASE IS CREATED AS A DRAFT AND PUBLISHED ONLY ONCE EVERY ASSET IS
# PRESENT AND ATTESTED. Until 2026-09-17 each of the three build legs created or
# looked up a PUBLIC release and uploaded its own bundle to it, with
# `fail-fast: false`, so the first leg to finish published a release with one asset
# in it and a failing leg left that release permanently incomplete — visible to
# users, and not something a re-run fixes. The three jobs below are the shape that
# removes that: `guard` refuses a tag that should not be built, `build` holds no
# write permission at all, and `publish` is the only thing that can make a release
# public, which it does after checking the asset set twice.
#
# ⛔ LINUX BUILDS ON ubuntu-22.04 AND ubuntu-22.04-arm ON PURPOSE: THE RUNNER IS THE
# glibc FLOOR. glibc is forward-compatible and not backward-compatible, so a binary
# linked against 24.04's glibc refuses to start on 22.04, while one linked on 22.04
# runs on both. These are the oldest images GitHub offers for either architecture, so
# "upgrading" either runner silently drops every user on an older distribution.
# ci.yml's `installers` and its `rust` job run on the same images so the floor is
# exercised before tag time.
#
# macOS builds are SIGNED with the "Developer ID Application: Distronode Corporation
# (R935BA6767)" identity and NOTARISED, both by the Tauri CLI inside tauri-action:
# it imports APPLE_CERTIFICATE into a temporary keychain, signs with the hardened
# runtime, submits the .app to Apple's notary service with the App Store Connect
# API key (APPLE_API_*) and staples the ticket before the .dmg is made. The key is a
# dedicated Developer-role key used for nothing else, not the iOS app's key.
# `Verify the macOS signature` below checks the result inside the .dmg, because a
# build that silently fell back to unsigned would otherwise ship, and also checks that
# the binary really carries both architectures. Rehearsed locally
# on 2026-09-18 before the first tag.
#
# Two more things are signed and notarised in the macOS leg, outside tauri-action:
#   the .dmg   tauri-bundler signs it but never submits it, so up to 1.2.0 only the
#              .app inside was notarised. `Notarise and staple the .dmg` submits it,
#              staples the ticket and asserts Gatekeeper reads it as notarised.
#   the CLI    a bare Mach-O, signed with the same identity from a keychain of its
#              own (tauri-action's is gone by then), with the hardened runtime and a
#              stable identifier, then submitted as a zip. A bare Mach-O cannot hold
#              a stapled ticket, so Gatekeeper looks the ticket up online.
# Every step that reads a signing or notary secret names it in its own `env:`, and
# each refuses to run without it: no identity means a failed leg, never an unsigned
# asset.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Never cancel a release in flight: a cancelled job can leave a draft release with
# only some of its assets uploaded, which the publish job would then have to clean up.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that can refuse the release before a single minute of build time is
  # spent, plus the release notes, extracted once so the body cannot differ per leg.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      body: ${{ steps.notes.outputs.body }}
      have_notes: ${{ steps.notes.outputs.have_notes }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed by the ancestry check below: a shallow clone has no merge base.
          fetch-depth: 0
          # Credentials kept here only: the `git fetch` below needs them in a private
          # (staging) repository. This job runs no dependency code.
          # zizmor: ignore[artipacked] -- deliberate, for the reason above; nothing in
          # this job uploads an artifact, so the persisted credential cannot leak into one.

      # ⛔ A TAG IS NOT A BRANCH, AND CI DOES NOT RUN ON ONE. ci.yml triggers on
      # pushes to `main` and on pull requests, so a tag placed on a commit that never
      # reached `main` — a local branch, an abandoned PR head, a detached HEAD — is
      # built, attested and released without a single test having run against it.
      # The attestation would be perfectly valid and would attest untested code.
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main."
            echo "CI never ran on this commit. Merge it to main first, then move the tag."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      # The three version literals (Cargo.toml, package.json and the npm package's
      # packaging/npm/package.json) agree with each other AND with the tag. Without
      # this a `v1.0.1` tag on an unbumped tree ships ten files named `1.0.0`,
      # because Tauri names every bundle after Cargo.toml's version (tauri.conf.json
      # deliberately sets none) and nothing else compares it with the tag, and the
      # `npm` job would refuse the release only after it was public.
      - name: Versions agree with the tag
        run: python3 scripts/check-version.py "$GITHUB_REF_NAME"

      # `build` is the `+<build>` half of the crash-report release name,
      # `com.distronode.bridgewatch@<version>+<build>`: the tagged commit's first
      # 12 hex digits. The build legs bake it into the binary (BRIDGEWATCH_BUILD)
      # and the `sentry` job names the Sentry release with it, so both read it here.
      - name: Expose the bare version and the build label
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      # Pulls the matching version's section out of CHANGELOG.md so the GitHub Release
      # and the CHANGELOG cannot drift. Index-based rather than a `\[` regex so it is
      # portable across awk flavours. It stops at the next version heading or at the
      # link-reference block at the end (`[x.y.z]: url`); a line inside a section that
      # merely starts with a Markdown link does not end it. Falls back to GitHub's
      # generated notes when the tag has no CHANGELOG entry.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v tag="## [${version}]" '
            index($0, tag)==1 {cap=1; next}
            index($0, "## [")==1 && cap==1 {cap=0}
            substr($0,1,1)=="[" && index($0, "]: ")>1 && cap==1 {exit}
            cap {print}
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi
          # Random delimiter: the body is attacker-influenced only by whoever can push
          # a tag, but a fixed one would still let a CHANGELOG line ending the heredoc
          # truncate or inject the output.
          delim="body_$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            cat release-notes.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  # The third-party licence texts, generated once for all three build legs. A job of
  # its own, read-only and holding no secret, because it installs and runs dependency
  # code (npm ci, a vite build) that `guard` must not.
  licenses:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_ABOUT_VERSION: 0.9.2
      CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-about
        run: |
          set -euo pipefail
          name="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/about.tgz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${name}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  $RUNNER_TEMP/about.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/about.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${name}/cargo-about" "$HOME/.cargo/bin/cargo-about"
          cargo about --version

      # `--frozen` after a locked fetch: the texts come from the crates Cargo.lock names,
      # read from the local registry, with no call to any licence service. `--fail`
      # refuses a crate whose licence cannot be read or clarified, and about.toml's
      # `accepted` (deny.toml's allow-list) refuses any other licence.
      - name: Rust crates
        run: |
          set -euo pipefail
          cargo fetch --locked
          mkdir -p target/licenses
          cargo about generate --frozen --fail --manifest-path src-tauri/Cargo.toml \
            -c about.toml -o target/licenses/THIRD-PARTY-LICENSES-rust.txt licenses/about.hbs
          grep -c '^  - ' target/licenses/THIRD-PARTY-LICENSES-rust.txt

      # The CLI's own set, for its tarballs and the npm package: the run above starts
      # from src-tauri and so never sees clap and the other crates only the CLI links.
      # Same flags, same allow-list. clap is asserted by name because a run that
      # silently fell back to the app's tree would still produce a non-empty file.
      - name: Rust crates of the CLI
        run: |
          set -euo pipefail
          cargo about generate --frozen --fail --manifest-path crates/bridgewatch-cli/Cargo.toml \
            -c about.toml -o target/licenses/THIRD-PARTY-LICENSES-cli.txt licenses/about.hbs
          grep -c '^  - ' target/licenses/THIRD-PARTY-LICENSES-cli.txt
          grep -qE '^  - clap ' target/licenses/THIRD-PARTY-LICENSES-cli.txt \
            || { echo "::error::THIRD-PARTY-LICENSES-cli.txt does not list clap"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: npm packages
        run: |
          set -euo pipefail
          npm ci
          node scripts/third-party-licenses-npm.mjs target/licenses/THIRD-PARTY-LICENSES-npm.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: target/licenses/
          if-no-files-found: error

  build:
    needs: [guard, licenses]
    # ⛔ READ-ONLY, DELIBERATELY. This job runs `cargo build`, which executes every
    # build script in a ~600-crate dependency tree, plus `npm ci`'s install scripts.
    # It used to hold `contents: write` and an `id-token` for the whole of that,
    # because it was also the thing that created the release. It no longer uploads
    # anything anywhere except this workflow run's own artifact store.
    permissions:
      contents: read
    # The `release` environment admits only `v*` tags, and the six APPLE_* signing and
    # notary secrets exist ONLY as its environment secrets: the repository-level copies
    # were deleted. So this job is the only place in the repository where the Developer ID
    # identity resolves, and no branch workflow and no pull request can read it.
    # ⛔ An environment secret only OVERRIDES a repository secret of the same name, it does
    # not block one. Re-adding a repository-level APPLE_* copy would therefore change
    # nothing here and would silently make the identity readable from every branch again.
    environment: release
    strategy:
      # Surface every leg's failure in one run rather than one per re-run. Nothing
      # public exists until `publish`, so a partially failed matrix costs only time.
      fail-fast: false
      matrix:
        include:
          # ONE universal .dmg from the Apple Silicon runner (macos-latest is arm64).
          # `tauri build --target universal-apple-darwin` builds the aarch64 and
          # x86_64 binaries separately (both targets must be installed) and joins
          # them with `lipo` before bundling, so signing and notarisation happen once,
          # on the fat .app. Replaced the per-arch .dmg pair after 1.0.0.
          # ⚠️ `target/` is the WORKSPACE target dir at the repo root: src-tauri is a
          # workspace member, so there is no src-tauri/target/ (measured on the first
          # local `tauri build`; the paths said src-tauri/target/ until then).
          - id: macos-universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle
            expected: 1
            # The CLI's tarball and npm vendor directory name. Both halves are built
            # with --target and joined by `lipo`, like the app.
            cli_target: universal-apple-darwin
          # ⛔ THE RUNNER IS THE glibc FLOOR (see the header): 22.04 is the oldest
          # image GitHub offers on either architecture. Do not move either leg to a
          # newer image. Both build natively with no --target, so the bundles land in
          # target/release/bundle: a .deb, an .rpm and an .AppImage each.
          - id: linux-x86_64
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
            bundle_dir: target/release/bundle
            expected: 3
            cli_target: x86_64-unknown-linux-gnu
          - id: linux-aarch64
            platform: ubuntu-22.04-arm
            args: ''
            rust_targets: ''
            bundle_dir: target/release/bundle
            expected: 3
            cli_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    # 90, was 60: the macOS leg now also builds the CLI for both architectures and
    # waits on two more notary submissions (the CLI and the .dmg).
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      CLI_TARGET: ${{ matrix.cli_target }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same apt list ci.yml's jobs install, written once in the local composite
      # action (no secret is passed to it, and it holds no `uses:` of its own).
      # libssl-dev is absent: reqwest is built on rustls and openssl-sys appears
      # nowhere in Cargo.lock.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        uses: $/.github/actions/linux-tauri-deps

      # Plain rustup, which every GitHub-hosted image carries, instead of a third-party
      # toolchain action: one less thing holding code execution in the job that builds
      # what users install. Components match rust-toolchain.toml.
      - name: Install the stable toolchain
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          # Space-separated; empty on the native Linux legs.
          for t in $RUST_TARGETS; do rustup target add "$t" --toolchain stable; done
          rustc --version

      # ⛔ NO CACHES IN THIS WORKFLOW, DELIBERATELY (neither rust-cache nor setup-node's
      # npm cache). A tag run can restore caches written by any main-branch run, and a
      # restored target/ or node_modules is build input that nobody reviewed in this
      # run. The release is rare and the minutes are cheap next to shipping an artifact
      # built from a poisoned cache under a valid provenance attestation.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      # Where src-tauri/tauri.licenses.conf.json expects them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: target/licenses

      # `tauri build` reaches cargo through the CLI, which gives no clean way to pass
      # `--locked`. This asserts the same property up front: it fails if the manifests
      # and Cargo.lock disagree, so a release can never be built from a dependency set
      # that is not the committed one.
      - name: Cargo.lock is up to date
        run: cargo fetch --locked

      # ── The CLI, built first ─────────────────────────────────────────────────
      # ⛔ BEFORE "Write the notarization key", on purpose: `cargo build` runs the
      # build scripts and proc macros of the crates only the CLI links, and none of
      # that code should run while the notary key is on disk. The local action
      # (shared with ci.yml) builds it fully stripped into cli-out/bridgewatch, whatever
      # the next step sets for the app, and checks the architectures, the strip, the
      # macOS minimum and `--version`. The app's bundles and debug files later in this
      # leg are untouched by it; it is signed, probed and packaged after them.
      - name: Build the CLI
        uses: $/.github/actions/build-cli
        with:
          target: ${{ matrix.cli_target }}
          version: ${{ needs.guard.outputs.version }}

      # ⛔ CRASH REPORTS NEED DEBUG INFORMATION THAT THE SHIPPED BINARY DOES NOT
      # CARRY. Cargo.toml's release profile strips everything (`strip = true`), so
      # for this workflow only:
      #   macOS  line tables, split into a .dSYM per architecture by dsymutil
      #          (which rustc runs BEFORE it strips), uploaded to Sentry by the
      #          `sentry` job. The shipped binary stays fully stripped.
      #   Linux  the symbol table is kept (`strip = "debuginfo"`), so a report
      #          names its functions even without uploaded files, and the binary
      #          itself is uploaded for unwinding. A split .dwp is not used: with
      #          the skeleton units stripped from the binary it maps to nothing
      #          (measured on 2026-10-25 with rustc 1.98.1).
      # Nothing else about the build changes.
      - name: Keep debug information for crash reports
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            echo "CARGO_PROFILE_RELEASE_DEBUG=line-tables-only" >> "$GITHUB_ENV"
            echo "CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=packed" >> "$GITHUB_ENV"
          else
            echo "CARGO_PROFILE_RELEASE_STRIP=debuginfo" >> "$GITHUB_ENV"
          fi

      # The notary key is a file for the Tauri CLI (APPLE_API_KEY_PATH), so it is
      # written to the runner's temp dir. It is deleted by "Remove the notarization
      # key" after the last submission, and the temp dir is wiped with the job.
      - name: Write the notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "::error::APPLE_API_KEY_P8 is not set"; exit 1; fi
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build the bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Signing and notarization, macOS leg only (the Linux legs never see them).
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          # ⛔ tauri-action defaults this to "true", and "true" means the .dmg bundler
          # does NOT pass create-dmg's `--skip-jenkins`, so it runs the Finder window
          # AppleScript on a headless runner. That osascript is the classic
          # hours-long hang in this workflow. "false" restores the `CI: true` check
          # and skips it; the only loss is the styled disk-image window.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
          # Crash reports (src-tauri/src/crash.rs), read with `option_env!` at
          # compile time: the address reports go to, and the build label the
          # release name ends with. A build without the address never sends a
          # report, and asks nobody; the step after this one refuses that build.
          BRIDGEWATCH_SENTRY_DSN: ${{ secrets.BRIDGEWATCH_SENTRY_DSN }}
          BRIDGEWATCH_BUILD: ${{ needs.guard.outputs.build }}
        with:
          # ⛔ NO `tagName` AND NO `releaseId`, ON PURPOSE. With neither, the action
          # logs "No releaseId or tagName provided, skipping all uploads..." and does
          # nothing but build (verified in its src/index.ts at this pinned SHA). That
          # is what lets this job be read-only, and it is also what stops it uploading
          # the extra macOS asset it would otherwise produce: given a `.app` with no
          # sibling `.app.tar.gz`, the action tars the bundle and uploads that too,
          # outside the attestation.
          # The overlay adds the two third-party licence files to every bundle; a
          # missing file fails the build rather than shipping without it.
          args: ${{ matrix.args }} --config src-tauri/tauri.licenses.conf.json
          retryAttempts: 2

      # ⛔ AN EMPTY SECRET BUILDS A RELEASE WITH CRASH REPORTS SILENTLY ABSENT, so
      # the binary is checked for the address it was meant to carry, and the
      # debug files the `sentry` job uploads are collected here. They are this
      # run's artifact only; this job still writes nowhere else.
      - name: The binary carries the crash-report address; keep its debug files
        shell: bash
        env:
          BRIDGEWATCH_SENTRY_DSN: ${{ secrets.BRIDGEWATCH_SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -z "$BRIDGEWATCH_SENTRY_DSN" ]; then
            echo "::error::BRIDGEWATCH_SENTRY_DSN is not set; this release would carry no crash-report address"
            exit 1
          fi
          mkdir -p debug-files
          if [ "$RUNNER_OS" = macOS ]; then
            bin=target/universal-apple-darwin/release/bridgewatch-app
            for arch in aarch64-apple-darwin x86_64-apple-darwin; do
              dsym="target/$arch/release/bridgewatch-app.dSYM"
              [ -d "$dsym" ] || { echo "::error::no $dsym"; exit 1; }
              mkdir -p "debug-files/$arch"
              # cargo uplifts the .dSYM as a relative symlink into deps/; -L copies the bundle
              cp -RL "$dsym" "debug-files/$arch/"
              ls "debug-files/$arch/bridgewatch-app.dSYM/Contents/Resources/DWARF/"* >/dev/null \
                || { echo "::error::no DWARF in the copied $dsym"; exit 1; }
            done
          else
            bin=target/release/bridgewatch-app
            cp "$bin" debug-files/
          fi
          [ -f "$bin" ] || { echo "::error::no $bin"; exit 1; }
          grep -qF "$BRIDGEWATCH_SENTRY_DSN" "$bin" \
            || { echo "::error::$bin does not carry the crash-report address"; exit 1; }
          find debug-files -maxdepth 3 | sort

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-files-${{ matrix.id }}
          path: debug-files/
          if-no-files-found: error

      # ⛔ tauri-action EXITS 0 WHEN IT FINDS NO ARTIFACTS AND HAS NOT BEEN ASKED TO
      # UPLOAD ANY, so the step above cannot be trusted to have produced anything. The
      # local action asserts the count per leg (shared with ci.yml's `installers`).
      - name: Stage this leg's bundles
        uses: $/.github/actions/stage-bundles
        with:
          bundle-dir: ${{ matrix.bundle_dir }}
          expected: ${{ matrix.expected }}

      # ⛔ THE .dmg ITSELF WAS NEVER NOTARISED UP TO 1.2.0. tauri-bundler signs the
      # .dmg with the Developer ID but submits only the .app inside it, so a downloaded
      # .dmg was assessed online by Gatekeeper with no ticket for the image. It is
      # submitted here, before every check below mounts it, its ticket is stapled
      # into it, and Gatekeeper's own reading of the stapled image is asserted:
      # `spctl -t open --context context:primary-signature` is the assessment macOS
      # makes when a user opens a downloaded disk image.
      - name: Notarise and staple the .dmg
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          dmgs=(staging/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] && [ -f "${dmgs[0]}" ] \
            || { echo "::error::expected exactly one staged .dmg"; exit 1; }
          dmg="${dmgs[0]}"
          bash .github/scripts/notarise.sh "$dmg"
          # Apple's ticket can lag the Accepted verdict by a moment (stapler error 65),
          # so the staple is tried up to three times, 15 s apart.
          stapled=false
          for attempt in 1 2 3; do
            if xcrun stapler staple "$dmg"; then stapled=true; break; fi
            echo "stapling attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          [ "$stapled" = true ] || { echo "::error::could not staple the notarisation ticket to $dmg"; exit 1; }
          xcrun stapler validate "$dmg"
          # Captured first, then matched: see the pipefail note in the next step.
          assessed="$(spctl -a -t open --context context:primary-signature -vv "$dmg" 2>&1)" \
            || { printf '%s\n' "$assessed"; echo "::error::Gatekeeper rejects $dmg"; exit 1; }
          printf '%s\n' "$assessed"
          grep -qF 'source=Notarized Developer ID' <<<"$assessed" \
            || { echo "::error::Gatekeeper does not read $dmg as notarised"; exit 1; }

      # ⛔ A tauri build with no usable identity does not fail, it ships unsigned. So
      # the .app INSIDE the staged .dmg is checked for the Developer ID signature, a
      # valid seal, a stapled notarization ticket and a Gatekeeper pass.
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mnt="$(mktemp -d)"
          # ⛔ The .dmg carries a software licence agreement (the Apache licence), which
          # hdiutil asks to be accepted and CANCELS on an empty stdin ("attach canceled",
          # the v0.1.0 run's first failure). `yes` accepts it, fed by process
          # substitution rather than a pipe so pipefail cannot trip on yes's SIGPIPE.
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" staging/*.dmg < <(yes) >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
          app="$(find "$mnt" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$app" ] || { echo "::error::no .app inside the .dmg"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          # ⛔ Captured first: `codesign | grep -q` under pipefail FAILS on a correct
          # signature, because grep exits at the first match and codesign dies on the
          # closed pipe. Proven both ways locally on 2026-09-18 (signed .dmg passes,
          # unsigned .dmg fails).
          sig="$(codesign -dv --verbose=2 "$app" 2>&1)"
          grep -qF 'Authority=Developer ID Application: Distronode Corporation (R935BA6767)' <<<"$sig" \
            || { echo "::error::not signed with the Distronode Developer ID"; exit 1; }
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          # The licence files, as the bundle resources put them.
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES-rust.txt THIRD-PARTY-LICENSES-npm.txt; do
            [ -s "$app/Contents/Resources/$f" ] || { echo "::error::the .app has no Contents/Resources/$f"; exit 1; }
          done

      # ⛔ A universal build that quietly produced one architecture would still sign,
      # notarise and pass Gatekeeper, and then refuse to start on the other half of the
      # fleet, so the executable inside the .dmg's .app must be fat. Its own step (the
      # local action re-mounts the .dmg), shared with ci.yml's `installers`.
      - name: The .app is universal
        if: runner.os == 'macOS'
        uses: $/.github/actions/dmg-is-universal

      # The core shells out to `secret-tool` on Linux; the local action (shared with
      # ci.yml's `installers`) asserts it on the built packages, not on the config.
      - name: The .deb and .rpm depend on secret-tool
        if: runner.os == 'Linux'
        uses: $/.github/actions/linux-packages-need-secret-tool

      # LICENSE, NOTICE and the third-party licence texts: in the package documentation
      # directory of the .deb and the .rpm, and among the AppImage's resources.
      - name: The Linux bundles carry the licence files
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # tauri-bundler writes the .deb's data members as `usr/...`, with no `./` in
          # front (measured on a CI installers build), where dpkg-built packages have
          # one; the prefix is stripped so the match is exact either way.
          deb="$(dpkg-deb --fsys-tarfile staging/*.deb | tar -t | sed 's#^\./##')"
          for f in copyright NOTICE THIRD-PARTY-LICENSES-rust.txt THIRD-PARTY-LICENSES-npm.txt; do
            grep -qxF "usr/share/doc/bridgewatch/$f" <<<"$deb" || { echo "::error::the .deb has no /usr/share/doc/bridgewatch/$f"; exit 1; }
          done
          rpm_files="$(rpm -qpl staging/*.rpm)"
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES-rust.txt THIRD-PARTY-LICENSES-npm.txt; do
            grep -qxF "/usr/share/licenses/bridgewatch/$f" <<<"$rpm_files" || { echo "::error::the .rpm has no /usr/share/licenses/bridgewatch/$f"; exit 1; }
          done
          appimage="$(find "$PWD/staging" -name '*.AppImage')"
          work="$(mktemp -d)"
          chmod +x "$appimage"
          (cd "$work" && "$appimage" --appimage-extract >/dev/null)
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES-rust.txt THIRD-PARTY-LICENSES-npm.txt; do
            [ -n "$(find "$work/squashfs-root" -type f -name "$f" -size +0)" ] || { echo "::error::the .AppImage has no $f"; exit 1; }
          done

      # tauri-action's keychain is not available to this step (and is not reused on
      # purpose), so the CLI gets a temporary keychain of its own, deleted on exit.
      # The hardened runtime and a stable identifier, which a bare Mach-O otherwise
      # takes from its file name; --timestamp, which notarisation requires. Then a zip
      # to the notary service (a bare Mach-O cannot be submitted, nor stapled).
      - name: Sign and notarise the CLI
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          CLI_IDENTIFIER: com.distronode.bridgewatch.cli
        run: |
          set -euo pipefail
          # ⛔ No identity is a failed leg, never an unsigned CLI.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set; refusing to ship an unsigned CLI"
              exit 1
            fi
          done
          bin=cli-out/bridgewatch
          kc="$RUNNER_TEMP/bridgewatch-cli-signing.keychain-db"
          p12="$RUNNER_TEMP/bridgewatch-cli-signing.p12"
          kcpass="$(openssl rand -hex 24)"
          echo "::add-mask::$kcpass"
          cleanup() {
            security delete-keychain "$kc" >/dev/null 2>&1 || true
            rm -f "$p12"
          }
          trap cleanup EXIT
          ( umask 077 && printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12" )
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          # In the search list too, so the certificate chain resolves; --keychain
          # below still picks the identity from this keychain alone.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%\"}"
            line="${line#\"}"
            [ -n "$line" ] && existing+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$kc" "${existing[@]}"

          codesign --force --options runtime --timestamp --identifier "$CLI_IDENTIFIER" \
            --keychain "$kc" --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          # Captured first: `codesign | grep -q` under pipefail fails on a correct
          # signature (see "Verify the macOS signature").
          sig="$(codesign -dv --verbose=2 "$bin" 2>&1)"
          grep -qF 'Authority=Developer ID Application: Distronode Corporation (R935BA6767)' <<<"$sig" \
            || { echo "::error::the CLI is not signed with the Distronode Developer ID"; exit 1; }
          grep -qxF "Identifier=$CLI_IDENTIFIER" <<<"$sig" \
            || { echo "::error::the CLI's identifier is not $CLI_IDENTIFIER"; exit 1; }
          grep -qE '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime' <<<"$sig" \
            || { echo "::error::the CLI is not signed with the hardened runtime"; exit 1; }
          grep -q '^Timestamp=' <<<"$sig" \
            || { echo "::error::the CLI's signature carries no secure timestamp"; exit 1; }

          zip="$RUNNER_TEMP/bridgewatch-cli-notarise.zip"
          ditto -c -k --keepParent "$bin" "$zip"
          bash .github/scripts/notarise.sh "$zip"
          rm -f "$zip"
          # Signing must not have broken the binary.
          "$bin" --version

      # The CLI was the last notary submission, so the key leaves the disk here, and
      # also when anything above failed. Nothing after this step needs it.
      - name: Remove the notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then rm -f "$APPLE_API_KEY_PATH"; fi
          rm -f "$RUNNER_TEMP/notary.p8"

      # The core reads glab's and gh's tokens by running `security
      # find-generic-password`; whether that still works from inside a
      # hardened-runtime binary is proven here on the binary that ships, against a
      # throwaway keychain item (no real secret). The local action is shared with
      # ci.yml, which runs it on the same binary signed ad hoc.
      - name: The hardened-runtime CLI reads the keychain
        if: runner.os == 'macOS'
        uses: $/.github/actions/cli-keychain-probe
        with:
          binary: cli-out/bridgewatch

      # ⛔ THE TARBALL CARRIES THE MODE. upload-artifact drops the executable bit, so
      # the binary is never shipped bare: `bridgewatch-cli_<version>_<target>/` holds
      # it at 0755 with LICENSE, NOTICE and the CLI's own third-party licence texts.
      # Its exact listing and the binary's mode are asserted. The `npm` job extracts
      # these same files, so this is also the npm package's input.
      # The script is shared with ci.yml's `npm-rehearsal`, which runs it on every pull
      # request, so this step is not first exercised at a tag.
      - name: Package the CLI
        shell: bash
        run: |
          bash .github/scripts/package-cli.sh "$VERSION" "$CLI_TARGET" cli-out/bridgewatch \
            target/licenses/THIRD-PARTY-LICENSES-cli.txt staging

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.id }}
          path: staging/
          if-no-files-found: error
          # The bundles are already compressed; re-deflating them costs minutes and
          # saves nothing.
          compression-level: 0

  # The Sentry release for crash reports: created under the same name the binaries
  # carry, given the debug files the build legs kept, and pointed at its commits.
  # A job of its own because it is the only one holding SENTRY_AUTH_TOKEN, which
  # must never be in `build` (every build script in the tree runs there). It runs
  # no dependency code: a pinned sentry-cli binary, checked against its SHA-256,
  # and git. `publish` does not wait for it: symbols arriving late, or a Sentry
  # outage, must not hold a release back, and a failure here is re-runnable.
  #
  # The two secrets:
  #   SENTRY_AUTH_TOKEN       here, with project:releases and project:write on
  #                           distronode-corporation-eu/bridgewatch
  #   BRIDGEWATCH_SENTRY_DSN  in `build`, baked into the binary (a DSN is not a
  #                           credential, it ships in every copy, but it is kept
  #                           out of the repository all the same)
  # `set-commits --auto` needs this GitHub repository connected to the Sentry
  # organisation; `--ignore-missing` lets the first release, which has no
  # previous one to diff against, through.
  sentry:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      # The checkout, for the history `set-commits --auto` reads. Nothing here
      # writes to GitHub.
      contents: read
    env:
      SENTRY_CLI_VERSION: 3.8.0
      SENTRY_CLI_SHA256: 13f8cb34ae01a6a272d7d7c22e277a105286615b4020de900ea95a8de47cdbb6
      SENTRY_URL: https://de.sentry.io
      SENTRY_ORG: distronode-corporation-eu
      SENTRY_PROJECT: bridgewatch
      # No update check against Sentry's release registry from a pinned binary.
      SENTRY_DISABLE_UPDATE_CHECK: 'true'
      # Must equal crash::release_name() in the binaries.
      SENTRY_RELEASE: com.distronode.bridgewatch@${{ needs.guard.outputs.version }}+${{ needs.guard.outputs.build }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      # Full history, for `set-commits --auto`, which reads it from git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: debug-files-*
          path: debug-files

      - name: Install sentry-cli
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sentry-cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          echo "${SENTRY_CLI_SHA256}  $RUNNER_TEMP/sentry-cli" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/sentry-cli" "$HOME/.local/bin/sentry-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sentry-cli" --version

      - name: Create the Sentry release, upload the debug files, set its commits
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "::error::SENTRY_AUTH_TOKEN is not set"; exit 1; fi
          echo "release $SENTRY_RELEASE"
          sentry-cli releases new "$SENTRY_RELEASE"
          # The two .dSYMs (one per macOS architecture) and the two Linux
          # binaries. `--wait` reports a file Sentry could not process as a
          # failure instead of leaving it to be found at the first crash.
          sentry-cli debug-files upload --wait debug-files
          sentry-cli releases set-commits "$SENTRY_RELEASE" --auto --ignore-missing
          sentry-cli releases finalize "$SENTRY_RELEASE"

  # The only job that can write to the repository, and the only one that can make a
  # release public. It sees bundles, never source, and never runs a build script.
  publish:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Creating the release and uploading its assets.
      contents: write
      # Both only for the provenance attestation: id-token to obtain the OIDC token
      # Sigstore signs against, attestations to store the result.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ⛔ This job never checks out the repository, and `gh release` resolves its
      # repository from the git remote of the working directory unless told. Without
      # GH_REPO every `gh release` call below fails "not a git repository".
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      # v8 of download-artifact and v7 of upload-artifact both depend on
      # @actions/artifact ^6, i.e. the same artifact protocol, and both run on node24.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          merge-multiple: true
          path: assets

      # ⛔ THE ASSET SET IS THE THING BEING DESIGNED OUT, SO IT IS ASSERTED BY NAME.
      # A count is not enough: a leg that built the wrong architecture, or a tree
      # whose Cargo.toml version drifted from the tag, both produce the right
      # number of files with the wrong names. These ten names are the ones README.md
      # tells users to download. The seven bundles follow tauri-bundler's own scheme:
      # .dmg `_universal`, .deb `_amd64`/`_arm64`, .AppImage `_amd64`/`_aarch64`, and
      # .rpm `<name>-<version>-<release>.<arch>` with the default release `1`. The three
      # CLI tarballs are named by the build legs' `Package the CLI` step after their
      # Rust target triple (universal-apple-darwin for the lipo'd pair).
      # The list is written once here and re-read by the check against GitHub below.
      - name: The ten release assets are exactly what was expected
        run: |
          set -euo pipefail
          printf '%s\n' \
            "bridgewatch_${VERSION}_universal.dmg" \
            "bridgewatch_${VERSION}_amd64.deb" \
            "bridgewatch_${VERSION}_arm64.deb" \
            "bridgewatch_${VERSION}_amd64.AppImage" \
            "bridgewatch_${VERSION}_aarch64.AppImage" \
            "bridgewatch-${VERSION}-1.x86_64.rpm" \
            "bridgewatch-${VERSION}-1.aarch64.rpm" \
            "bridgewatch-cli_${VERSION}_universal-apple-darwin.tar.gz" \
            "bridgewatch-cli_${VERSION}_x86_64-unknown-linux-gnu.tar.gz" \
            "bridgewatch-cli_${VERSION}_aarch64-unknown-linux-gnu.tar.gz" | sort > "$RUNNER_TEMP/expected-assets.txt"
          expected="$(cat "$RUNNER_TEMP/expected-assets.txt")"
          actual="$(cd assets && find . -type f -printf '%f\n' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::built assets do not match the ten names a release must carry"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          printf '%s\n' "$actual"

      # Signed provenance over the bytes a user downloads, verifiable with:
      #   gh attestation verify bridgewatch_1.0.0_amd64.deb --repo distronode-corporation/bridgewatch
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      # The attestation is ONE Sigstore bundle whose subjects are all ten assets (the
      # action's `bundle-path`, one JSON line). It is attached to the release as
      # `bridgewatch_<version>.intoto.jsonl`, so a user can verify offline with
      # `gh attestation verify <asset> --bundle <that file> --repo ...`, and so OpenSSF
      # Scorecard's Signed-Releases check finds provenance on the release. It is kept out
      # of assets/, which holds exactly the ten files the name check above asserted.
      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ -s "$BUNDLE_PATH" ] || { echo "::error::the attestation step wrote no bundle"; exit 1; }
          mkdir -p provenance
          cp "$BUNDLE_PATH" "provenance/bridgewatch_${VERSION}.intoto.jsonl"
          echo "bridgewatch_${VERSION}.intoto.jsonl" >> "$RUNNER_TEMP/expected-assets.txt"
          sort -o "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/expected-assets.txt"

      # README.md promises every asset carries an attestation. This is the only place
      # that claim is ever tested, and it runs before anything becomes public: a
      # failure here leaves a draft (or nothing) rather than a release whose
      # provenance does not verify.
      - name: The attestations verify
        run: |
          set -euo pipefail
          for f in assets/*; do
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; then
                # And against the file that will be attached, which is what a user
                # verifying offline will hold.
                gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
                  --bundle "provenance/bridgewatch_${VERSION}.intoto.jsonl"
                continue 2
              fi
              echo "attestation for $(basename "$f") not queryable yet (attempt $attempt)"
              sleep 15
            done
            echo "::error::no verifiable attestation for $(basename "$f")"
            exit 1
          done

      # Draft first. A draft is invisible to users and to the releases API's `latest`,
      # so everything above this line can fail without anyone seeing a half-built
      # release.
      - name: Create the draft release
        env:
          NOTES: ${{ needs.guard.outputs.body }}
          HAVE_NOTES: ${{ needs.guard.outputs.have_notes }}
        run: |
          set -euo pipefail
          # A leftover draft from a failed run is deleted and rebuilt; a release that
          # is already PUBLIC is never touched. `gh release delete` leaves the tag
          # alone (that needs --cleanup-tag).
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "deleting a leftover draft for $TAG"
              gh release delete "$TAG" --yes
            else
              echo "::error::$TAG is already published. Refusing to modify a public release."
              exit 1
            fi
          fi
          # $NOTES arrives through the environment, never interpolated into this
          # script: it is CHANGELOG text and would otherwise be shell source.
          if [ "$HAVE_NOTES" = "true" ]; then
            printf '%s\n' "$NOTES" > release-notes.md
            gh release create "$TAG" --draft --title "bridgewatch $TAG" \
              --notes-file release-notes.md assets/* provenance/*
          else
            gh release create "$TAG" --draft --title "bridgewatch $TAG" \
              --generate-notes assets/* provenance/*
          fi

      # The same assertion again, this time against what GitHub actually stored, with
      # the provenance bundle added to the list. The check above proves the files
      # existed on this runner; only this one proves the upload of each succeeded.
      - name: GitHub holds all ten assets and the provenance bundle
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/expected-assets.txt")"
          [ -n "$expected" ] || { echo "::error::the expected asset list is empty"; exit 1; }
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the draft release does not hold the expected assets; leaving it as a draft"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest

  # npm: `npx bridgewatch` and `npm install --global bridgewatch`. The package is
  # packaging/npm: bin/bridgewatch.js, a shim with no dependencies that runs the right
  # one of three vendored binaries, and those binaries, which are the bytes the build
  # legs packaged and `publish` attested, downloaded from the public release and
  # checked against the digests GitHub recorded for them and their attestation.
  # Trusted publishing: npm exchanges this job's OIDC token for a one-time publish
  # token (npm 11.5.1 or later) and adds the provenance attestation itself.
  #
  # ⛔ OFF until vars.NPM_PUBLISH is 'true', which is set only once the `bridgewatch`
  # package's trusted publisher on npm names this repository and this file,
  # release.yml, with no environment. npm requires the first publish under a new
  # trusted publisher within 2 days of creating it. Renaming this file or adding an
  # environment breaks publishing until that entry is changed to match.
  # ⛔ The trusted publisher must also ALLOW `npm publish` (`npm trust ...
  # --allow-publish`), which is off by default: without it the first publish from
  # here fails with 403 even though the trust entry exists. This job publishes
  # directly, as worldinmotion's does.
  # It runs only after `publish`, so nothing reaches npm without its GitHub Release;
  # a failure here leaves the release public and can be re-run on its own. It refuses
  # a version npm already holds.
  npm:
    needs: [guard, publish]
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # The checkout and the release download.
      contents: read
      # Verifying the tarballs' build provenance.
      attestations: read
      # The OIDC token npm exchanges for the publish, and signs the provenance with.
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
      TARGETS: universal-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # registry-url as npm's trusted publishing guide has it. No cache, as everywhere here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Older npm has no trusted publishing and would fail with an authentication error.
      - name: npm supports trusted publishing
        run: |
          set -euo pipefail
          have="$(npm --version)"
          echo "npm $have"
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $have predates trusted publishing (11.5.1)."
            exit 1
          fi

      # Asked of the registry without credentials: 404 means not published, 200 means it
      # is, anything else is an answer this job cannot read. Before any download, so a
      # re-run after a successful publish stops here.
      - name: The version is not on npm yet
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/bridgewatch/$VERSION")"
          case "$status" in
            404) echo "bridgewatch@$VERSION is not on npm yet" ;;
            200) echo "::error::bridgewatch@$VERSION is already on npm. Refusing to publish it again."; exit 1 ;;
            *) echo "::error::the npm registry answered $status for bridgewatch@$VERSION"; exit 1 ;;
          esac

      # The three CLI tarballs, from the release `publish` just made public. Each must
      # match the SHA-256 GitHub recorded for the asset when it was uploaded, and its
      # build provenance attestation must verify.
      - name: Download and check the CLI tarballs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dl"
          : > "$RUNNER_TEMP/SHA256SUMS"
          for t in $TARGETS; do
            name="bridgewatch-cli_${VERSION}_${t}.tar.gz"
            # The name is matched in awk, not spliced into the jq program.
            digest="$(gh api "repos/$GH_REPO/releases/tags/$TAG" \
              --jq '.assets[] | "\(.name) \(.digest)"' | awk -v n="$name" '$1 == n {print $2}')"
            case "$digest" in
              sha256:????????????????????????????????????????????????????????????????) ;;
              *) echo "::error::the release has no SHA-256 digest for $name (got: ${digest:-nothing})"; exit 1 ;;
            esac
            printf '%s  %s\n' "${digest#sha256:}" "$name" >> "$RUNNER_TEMP/SHA256SUMS"
            gh release download "$TAG" --pattern "$name" --dir "$RUNNER_TEMP/dl"
          done
          (cd "$RUNNER_TEMP/dl" && sha256sum -c "$RUNNER_TEMP/SHA256SUMS")
          # Pinned to this workflow, at this tag and its commit, on a GitHub-hosted
          # runner: an attestation from any other workflow, ref or commit in the
          # repository does not count.
          for f in "$RUNNER_TEMP"/dl/*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      # The shared scripts ci.yml's `npm-rehearsal` runs on every pull request, so
      # neither step is first exercised here. npm-stage.sh checks each tarball's exact
      # listing before extracting it into packaging/npm/vendor/<target>/ at 0755 and
      # puts the licence files at the package root; npm-pack.sh packs it and asserts
      # the nine-file list and that every executable is 0755. The file it checked is
      # the one published.
      - name: Stage the package
        run: bash .github/scripts/npm-stage.sh "$VERSION" "$RUNNER_TEMP/dl"

      - name: Pack and check the package
        run: |
          set -euo pipefail
          bash .github/scripts/npm-pack.sh "$VERSION" "$RUNNER_TEMP/npm"
          echo "TGZ=$RUNNER_TEMP/npm/bridgewatch-$VERSION.tgz" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: npm publish "$TGZ" --provenance --access public
