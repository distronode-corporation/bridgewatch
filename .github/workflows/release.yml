name: Release

# Fires on a `vX.Y.Z` tag and produces the seven assets a user can install: one
# universal macOS .dmg (Apple Silicon and Intel in one binary), and a .deb, an .rpm and
# an .AppImage for each of Linux x86_64 and arm64. Windows is not targeted. An eighth
# file, `bridgewatch_<version>.intoto.jsonl`, is the signed provenance attestation over
# all seven, attached so it can be verified offline and found by OpenSSF Scorecard.
#
# Every bundle carries LICENSE, NOTICE and the licence texts of the third-party code
# linked into it: THIRD-PARTY-LICENSES-rust.txt (cargo-about over Cargo.lock) and
# THIRD-PARTY-LICENSES-npm.txt (the npm packages the frontend build kept). Both are
# generated by the `licenses` job and added to the bundle through
# src-tauri/tauri.licenses.conf.json, which only this workflow passes, because the
# files exist only here.
#
# ⛔ THE RELEASE IS CREATED AS A DRAFT AND PUBLISHED ONLY ONCE EVERY ASSET IS
# PRESENT AND ATTESTED. Until 2026-09-17 each of the three build legs created or
# looked up a PUBLIC release and uploaded its own bundle to it, with
# `fail-fast: false`, so the first leg to finish published a release with one asset
# in it and a failing leg left that release permanently incomplete — visible to
# users, and not something a re-run fixes. The three jobs below are the shape that
# removes that: `guard` refuses a tag that should not be built, `build` holds no
# write permission at all, and `publish` is the only thing that can make a release
# public, which it does after checking the asset set twice.
#
# ⛔ LINUX BUILDS ON ubuntu-22.04 AND ubuntu-22.04-arm ON PURPOSE: THE RUNNER IS THE
# glibc FLOOR. glibc is forward-compatible and not backward-compatible, so a binary
# linked against 24.04's glibc refuses to start on 22.04, while one linked on 22.04
# runs on both. These are the oldest images GitHub offers for either architecture, so
# "upgrading" either runner silently drops every user on an older distribution.
# ci.yml's `installers` and its `rust` job run on the same images so the floor is
# exercised before tag time.
#
# macOS builds are SIGNED with the "Developer ID Application: Distronode Corporation
# (R935BA6767)" identity and NOTARISED, both by the Tauri CLI inside tauri-action:
# it imports APPLE_CERTIFICATE into a temporary keychain, signs with the hardened
# runtime, submits the .app to Apple's notary service with the App Store Connect
# API key (APPLE_API_*) and staples the ticket before the .dmg is made. The key is a
# dedicated Developer-role key used for nothing else, not the iOS app's key.
# `Verify the macOS signature` below checks the result inside the .dmg, because a
# build that silently fell back to unsigned would otherwise ship, and also checks that
# the binary really carries both architectures. Rehearsed locally
# on 2026-09-18 before the first tag.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Never cancel a release in flight: a cancelled job can leave a draft release with
# only some of its assets uploaded, which the publish job would then have to clean up.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that can refuse the release before a single minute of build time is
  # spent, plus the release notes, extracted once so the body cannot differ per leg.
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.notes.outputs.body }}
      have_notes: ${{ steps.notes.outputs.have_notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed by the ancestry check below: a shallow clone has no merge base.
          fetch-depth: 0
          # Credentials kept here only: the `git fetch` below needs them in a private
          # (staging) repository. This job runs no dependency code.
          # zizmor: ignore[artipacked] -- deliberate, for the reason above; nothing in
          # this job uploads an artifact, so the persisted credential cannot leak into one.

      # ⛔ A TAG IS NOT A BRANCH, AND CI DOES NOT RUN ON ONE. ci.yml triggers on
      # pushes to `main` and on pull requests, so a tag placed on a commit that never
      # reached `main` — a local branch, an abandoned PR head, a detached HEAD — is
      # built, attested and released without a single test having run against it.
      # The attestation would be perfectly valid and would attest untested code.
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main."
            echo "CI never ran on this commit. Merge it to main first, then move the tag."
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

      # The three version literals agree with each other AND with the tag. Without
      # this a `v1.0.1` tag on an unbumped tree ships seven files named `1.0.0`,
      # because Tauri names every bundle after tauri.conf.json and nothing compares
      # the two.
      - name: Versions agree with the tag
        run: python3 scripts/check-version.py "$GITHUB_REF_NAME"

      - name: Expose the bare version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Pulls the matching version's section out of CHANGELOG.md so the GitHub Release
      # and the CHANGELOG cannot drift. Index-based rather than a `\[` regex so it is
      # portable across awk flavours. Falls back to GitHub's generated notes when the
      # tag has no CHANGELOG entry.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v tag="## [${version}]" '
            index($0, tag)==1 {cap=1; next}
            index($0, "## [")==1 && cap==1 {cap=0}
            substr($0,1,1)=="[" && cap==1 {exit}
            cap {print}
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi
          # Random delimiter: the body is attacker-influenced only by whoever can push
          # a tag, but a fixed one would still let a CHANGELOG line ending the heredoc
          # truncate or inject the output.
          delim="body_$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            cat release-notes.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  # The third-party licence texts, generated once for all three build legs. A job of
  # its own, read-only and holding no secret, because it installs and runs dependency
  # code (npm ci, a vite build) that `guard` must not.
  licenses:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_ABOUT_VERSION: 0.9.2
      CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-about
        run: |
          set -euo pipefail
          name="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/about.tgz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${name}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  $RUNNER_TEMP/about.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/about.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${name}/cargo-about" "$HOME/.cargo/bin/cargo-about"
          cargo about --version

      # `--frozen` after a locked fetch: the texts come from the crates Cargo.lock names,
      # read from the local registry, with no call to any licence service. `--fail`
      # refuses a crate whose licence cannot be read or clarified, and about.toml's
      # `accepted` (deny.toml's allow-list) refuses any other licence.
      - name: Rust crates
        run: |
          set -euo pipefail
          cargo fetch --locked
          mkdir -p target/licenses
          cargo about generate --frozen --fail --manifest-path src-tauri/Cargo.toml \
            -c about.toml -o target/licenses/THIRD-PARTY-LICENSES-rust.txt licenses/about.hbs
          grep -c '^  - ' target/licenses/THIRD-PARTY-LICENSES-rust.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: npm packages
        run: |
          set -euo pipefail
          npm ci
          node scripts/third-party-licenses-npm.mjs target/licenses/THIRD-PARTY-LICENSES-npm.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: target/licenses/
          if-no-files-found: error

  build:
    needs: [guard, licenses]
    # ⛔ READ-ONLY, DELIBERATELY. This job runs `cargo build`, which executes every
    # build script in a ~600-crate dependency tree, plus `npm ci`'s install scripts.
    # It used to hold `contents: write` and an `id-token` for the whole of that,
    # because it was also the thing that created the release. It no longer uploads
    # anything anywhere except this workflow run's own artifact store.
    permissions:
      contents: read
    # The `release` environment admits only `v*` tags, and the six APPLE_* signing and
    # notary secrets exist ONLY as its environment secrets: the repository-level copies
    # were deleted. So this job is the only place in the repository where the Developer ID
    # identity resolves, and no branch workflow and no pull request can read it.
    # ⛔ An environment secret only OVERRIDES a repository secret of the same name, it does
    # not block one. Re-adding a repository-level APPLE_* copy would therefore change
    # nothing here and would silently make the identity readable from every branch again.
    environment: release
    strategy:
      # Surface every leg's failure in one run rather than one per re-run. Nothing
      # public exists until `publish`, so a partially failed matrix costs only time.
      fail-fast: false
      matrix:
        include:
          # ONE universal .dmg from the Apple Silicon runner (macos-latest is arm64).
          # `tauri build --target universal-apple-darwin` builds the aarch64 and
          # x86_64 binaries separately (both targets must be installed) and joins
          # them with `lipo` before bundling, so signing and notarisation happen once,
          # on the fat .app. Replaced the per-arch .dmg pair after 1.0.0.
          # ⚠️ `target/` is the WORKSPACE target dir at the repo root: src-tauri is a
          # workspace member, so there is no src-tauri/target/ (measured on the first
          # local `tauri build`; the paths said src-tauri/target/ until then).
          - id: macos-universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle
            expected: 1
          # ⛔ THE RUNNER IS THE glibc FLOOR (see the header): 22.04 is the oldest
          # image GitHub offers on either architecture. Do not move either leg to a
          # newer image. Both build natively with no --target, so the bundles land in
          # target/release/bundle: a .deb, an .rpm and an .AppImage each.
          - id: linux-x86_64
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
            bundle_dir: target/release/bundle
            expected: 3
          - id: linux-aarch64
            platform: ubuntu-22.04-arm
            args: ''
            rust_targets: ''
            bundle_dir: target/release/bundle
            expected: 3
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Kept in step with ci.yml's LINUX_TAURI_DEPS. libssl-dev is absent from both:
      # reqwest is built on rustls and openssl-sys appears nowhere in Cargo.lock.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # Plain rustup, which every GitHub-hosted image carries, instead of a third-party
      # toolchain action: one less thing holding code execution in the job that builds
      # what users install. Components match rust-toolchain.toml.
      - name: Install the stable toolchain
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          # Space-separated; empty on the native Linux legs.
          for t in $RUST_TARGETS; do rustup target add "$t" --toolchain stable; done
          rustc --version

      # ⛔ NO CACHES IN THIS WORKFLOW, DELIBERATELY (neither rust-cache nor setup-node's
      # npm cache). A tag run can restore caches written by any main-branch run, and a
      # restored target/ or node_modules is build input that nobody reviewed in this
      # run. The release is rare and the minutes are cheap next to shipping an artifact
      # built from a poisoned cache under a valid provenance attestation.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      # Where src-tauri/tauri.licenses.conf.json expects them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses
          path: target/licenses

      # `tauri build` reaches cargo through the CLI, which gives no clean way to pass
      # `--locked`. This asserts the same property up front: it fails if the manifests
      # and Cargo.lock disagree, so a release can never be built from a dependency set
      # that is not the committed one.
      - name: Cargo.lock is up to date
        run: cargo fetch --locked

      # The notary key is a file for the Tauri CLI (APPLE_API_KEY_PATH), so it is
      # written to the runner's temp dir, which is wiped with the job.
      - name: Write the notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "::error::APPLE_API_KEY_P8 is not set"; exit 1; fi
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build the bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Signing and notarization, macOS leg only (the Linux legs never see them).
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          # ⛔ tauri-action defaults this to "true", and "true" means the .dmg bundler
          # does NOT pass create-dmg's `--skip-jenkins`, so it runs the Finder window
          # AppleScript on a headless runner. That osascript is the classic
          # hours-long hang in this workflow. "false" restores the `CI: true` check
          # and skips it; the only loss is the styled disk-image window.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
        with:
          # ⛔ NO `tagName` AND NO `releaseId`, ON PURPOSE. With neither, the action
          # logs "No releaseId or tagName provided, skipping all uploads..." and does
          # nothing but build (verified in its src/index.ts at this pinned SHA). That
          # is what lets this job be read-only, and it is also what stops it uploading
          # the extra macOS asset it would otherwise produce: given a `.app` with no
          # sibling `.app.tar.gz`, the action tars the bundle and uploads that too,
          # outside the attestation.
          # The overlay adds the two third-party licence files to every bundle; a
          # missing file fails the build rather than shipping without it.
          args: ${{ matrix.args }} --config src-tauri/tauri.licenses.conf.json
          retryAttempts: 2

      # ⛔ tauri-action EXITS 0 WHEN IT FINDS NO ARTIFACTS AND HAS NOT BEEN ASKED TO
      # UPLOAD ANY ("The action was not configured to upload artifacts, therefore this
      # is not handled as an error"). So the step above cannot be trusted to have
      # produced anything. This is where that is caught, per leg, by count.
      - name: Stage this leg's bundles
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          EXPECTED: ${{ matrix.expected }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          # -type f skips bundle/macos/*.app, which is a directory, and the name
          # filter is the whole of what this project ships.
          find "$BUNDLE_DIR" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} staging/ \;
          found="$(find staging -type f | wc -l | tr -d ' ')"
          if [ "$found" -ne "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED bundle(s) under $BUNDLE_DIR, staged $found"
            find "$BUNDLE_DIR" -maxdepth 3 || true
            exit 1
          fi
          ls -l staging

      # ⛔ A tauri build with no usable identity does not fail, it ships unsigned. So
      # the .app INSIDE the staged .dmg is checked for the Developer ID signature, a
      # valid seal, a stapled notarization ticket and a Gatekeeper pass.
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mnt="$(mktemp -d)"
          # ⛔ The .dmg carries a software licence agreement (the Apache licence), which
          # hdiutil asks to be accepted and CANCELS on an empty stdin ("attach canceled",
          # the v0.1.0 run's first failure). `yes` accepts it, fed by process
          # substitution rather than a pipe so pipefail cannot trip on yes's SIGPIPE.
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" staging/*.dmg < <(yes) >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
          app="$(find "$mnt" -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$app" ] || { echo "::error::no .app inside the .dmg"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          # ⛔ Captured first: `codesign | grep -q` under pipefail FAILS on a correct
          # signature, because grep exits at the first match and codesign dies on the
          # closed pipe. Proven both ways locally on 2026-09-18 (signed .dmg passes,
          # unsigned .dmg fails).
          sig="$(codesign -dv --verbose=2 "$app" 2>&1)"
          grep -qF 'Authority=Developer ID Application: Distronode Corporation (R935BA6767)' <<<"$sig" \
            || { echo "::error::not signed with the Distronode Developer ID"; exit 1; }
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          # ⛔ A universal build that quietly produced one architecture would still
          # sign, notarise and pass Gatekeeper, and then refuse to start on the other
          # half of the fleet. So the executable inside the .app must be fat.
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          lipo -info "$app/Contents/MacOS/$exe"
          # -archs prints the architectures alone; -info also echoes the path, which a
          # word match could hit.
          archs="$(lipo -archs "$app/Contents/MacOS/$exe")"
          for arch in x86_64 arm64; do
            grep -qw "$arch" <<<"$archs" || { echo "::error::$exe is not built for $arch (has: $archs)"; exit 1; }
          done
          # The licence files, as the bundle resources put them.
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES-rust.txt THIRD-PARTY-LICENSES-npm.txt; do
            [ -s "$app/Contents/Resources/$f" ] || { echo "::error::the .app has no Contents/Resources/$f"; exit 1; }
          done

      # The core shells out to `secret-tool` on Linux (tauri.conf.json declares the
      # dependency). A package without it installs cleanly and then cannot read a
      # keyring token, so it is asserted on the built packages, not on the config.
      - name: The .deb and .rpm depend on secret-tool
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          depends="$(dpkg-deb -f staging/*.deb Depends)"
          echo "deb Depends: $depends"
          grep -qw libsecret-tools <<<"$depends" || { echo "::error::the .deb does not depend on libsecret-tools"; exit 1; }
          # `rpm` is on both 22.04 images today; installed if a future image drops it.
          command -v rpm >/dev/null || { sudo apt-get update && sudo apt-get install -y rpm; }
          requires="$(rpm -qpR staging/*.rpm)"
          echo "rpm Requires:"
          echo "$requires"
          grep -qxF /usr/bin/secret-tool <<<"$requires" || { echo "::error::the .rpm does not require /usr/bin/secret-tool"; exit 1; }

      # LICENSE, NOTICE and the third-party licence texts: in the package documentation
      # directory of the .deb and the .rpm, and among the AppImage's resources.
      - name: The Linux bundles carry the licence files
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # tauri-bundler writes the .deb's data members as `usr/...`, with no `./` in
          # front (measured on a CI installers build), where dpkg-built packages have
          # one; the prefix is stripped so the match is exact either way.
          deb="$(dpkg-deb --fsys-tarfile staging/*.deb | tar -t | sed 's#^\./##')"
          for f in copyright NOTICE THIRD-PARTY-LICENSES-rust.txt THIRD-PARTY-LICENSES-npm.txt; do
            grep -qxF "usr/share/doc/bridgewatch/$f" <<<"$deb" || { echo "::error::the .deb has no /usr/share/doc/bridgewatch/$f"; exit 1; }
          done
          rpm_files="$(rpm -qpl staging/*.rpm)"
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES-rust.txt THIRD-PARTY-LICENSES-npm.txt; do
            grep -qxF "/usr/share/licenses/bridgewatch/$f" <<<"$rpm_files" || { echo "::error::the .rpm has no /usr/share/licenses/bridgewatch/$f"; exit 1; }
          done
          appimage="$(find "$PWD/staging" -name '*.AppImage')"
          work="$(mktemp -d)"
          chmod +x "$appimage"
          (cd "$work" && "$appimage" --appimage-extract >/dev/null)
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES-rust.txt THIRD-PARTY-LICENSES-npm.txt; do
            [ -n "$(find "$work/squashfs-root" -type f -name "$f" -size +0)" ] || { echo "::error::the .AppImage has no $f"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-${{ matrix.id }}
          path: staging/
          if-no-files-found: error
          # The bundles are already compressed; re-deflating them costs minutes and
          # saves nothing.
          compression-level: 0

  # The only job that can write to the repository, and the only one that can make a
  # release public. It sees bundles, never source, and never runs a build script.
  publish:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Creating the release and uploading its assets.
      contents: write
      # Both only for the provenance attestation: id-token to obtain the OIDC token
      # Sigstore signs against, attestations to store the result.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ⛔ This job never checks out the repository, and `gh release` resolves its
      # repository from the git remote of the working directory unless told. Without
      # GH_REPO every `gh release` call below fails "not a git repository".
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      # v8 of download-artifact and v7 of upload-artifact both depend on
      # @actions/artifact ^6, i.e. the same artifact protocol, and both run on node24.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundles-*
          merge-multiple: true
          path: assets

      # ⛔ THE ASSET SET IS THE THING BEING DESIGNED OUT, SO IT IS ASSERTED BY NAME.
      # A count is not enough: a leg that built the wrong architecture, or a tree
      # whose tauri.conf.json version drifted from the tag, both produce the right
      # number of files with the wrong names. These seven names are the ones README.md
      # tells users to download, and each follows tauri-bundler's own scheme: .dmg
      # `_universal`, .deb `_amd64`/`_arm64`, .AppImage `_amd64`/`_aarch64`, and .rpm
      # `<name>-<version>-<release>.<arch>` with the default release `1`.
      # The list is written once here and re-read by the check against GitHub below.
      - name: The seven release assets are exactly what was expected
        run: |
          set -euo pipefail
          printf '%s\n' \
            "bridgewatch_${VERSION}_universal.dmg" \
            "bridgewatch_${VERSION}_amd64.deb" \
            "bridgewatch_${VERSION}_arm64.deb" \
            "bridgewatch_${VERSION}_amd64.AppImage" \
            "bridgewatch_${VERSION}_aarch64.AppImage" \
            "bridgewatch-${VERSION}-1.x86_64.rpm" \
            "bridgewatch-${VERSION}-1.aarch64.rpm" | sort > "$RUNNER_TEMP/expected-assets.txt"
          expected="$(cat "$RUNNER_TEMP/expected-assets.txt")"
          actual="$(cd assets && find . -type f -printf '%f\n' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::built assets do not match the seven names a release must carry"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          printf '%s\n' "$actual"

      # Signed provenance over the bytes a user downloads, verifiable with:
      #   gh attestation verify bridgewatch_1.0.0_amd64.deb --repo distronode-corporation/bridgewatch
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      # The attestation is ONE Sigstore bundle whose subjects are all seven assets (the
      # action's `bundle-path`, one JSON line). It is attached to the release as
      # `bridgewatch_<version>.intoto.jsonl`, so a user can verify offline with
      # `gh attestation verify <asset> --bundle <that file> --repo ...`, and so OpenSSF
      # Scorecard's Signed-Releases check finds provenance on the release. It is kept out
      # of assets/, which holds exactly the seven files the name check above asserted.
      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ -s "$BUNDLE_PATH" ] || { echo "::error::the attestation step wrote no bundle"; exit 1; }
          mkdir -p provenance
          cp "$BUNDLE_PATH" "provenance/bridgewatch_${VERSION}.intoto.jsonl"
          echo "bridgewatch_${VERSION}.intoto.jsonl" >> "$RUNNER_TEMP/expected-assets.txt"
          sort -o "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/expected-assets.txt"

      # README.md promises every asset carries an attestation. This is the only place
      # that claim is ever tested, and it runs before anything becomes public: a
      # failure here leaves a draft (or nothing) rather than a release whose
      # provenance does not verify.
      - name: The attestations verify
        run: |
          set -euo pipefail
          for f in assets/*; do
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; then
                # And against the file that will be attached, which is what a user
                # verifying offline will hold.
                gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
                  --bundle "provenance/bridgewatch_${VERSION}.intoto.jsonl"
                continue 2
              fi
              echo "attestation for $(basename "$f") not queryable yet (attempt $attempt)"
              sleep 15
            done
            echo "::error::no verifiable attestation for $(basename "$f")"
            exit 1
          done

      # Draft first. A draft is invisible to users and to the releases API's `latest`,
      # so everything above this line can fail without anyone seeing a half-built
      # release.
      - name: Create the draft release
        env:
          NOTES: ${{ needs.guard.outputs.body }}
          HAVE_NOTES: ${{ needs.guard.outputs.have_notes }}
        run: |
          set -euo pipefail
          # A leftover draft from a failed run is deleted and rebuilt; a release that
          # is already PUBLIC is never touched. `gh release delete` leaves the tag
          # alone (that needs --cleanup-tag).
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "deleting a leftover draft for $TAG"
              gh release delete "$TAG" --yes
            else
              echo "::error::$TAG is already published. Refusing to modify a public release."
              exit 1
            fi
          fi
          # $NOTES arrives through the environment, never interpolated into this
          # script: it is CHANGELOG text and would otherwise be shell source.
          if [ "$HAVE_NOTES" = "true" ]; then
            printf '%s\n' "$NOTES" > release-notes.md
            gh release create "$TAG" --draft --title "bridgewatch $TAG" \
              --notes-file release-notes.md assets/* provenance/*
          else
            gh release create "$TAG" --draft --title "bridgewatch $TAG" \
              --generate-notes assets/* provenance/*
          fi

      # The same assertion again, this time against what GitHub actually stored, with
      # the provenance bundle added to the list. The check above proves the files
      # existed on this runner; only this one proves the upload of each succeeded.
      - name: GitHub holds all seven assets and the provenance bundle
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/expected-assets.txt")"
          [ -n "$expected" ] || { echo "::error::the expected asset list is empty"; exit 1; }
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the draft release does not hold the expected assets; leaving it as a draft"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest
