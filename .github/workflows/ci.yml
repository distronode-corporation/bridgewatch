name: CI

# bridgewatch is two halves that break independently: a pure-Rust core crate
# (crates/bridgewatch-core, no Tauri dependency, fixture-tested) and a Tauri 2 shell
# around a Svelte 5 frontend. `rust` covers the Rust workspace on both release
# platforms, `frontend` the Svelte half including the Tailwind build, and `msrv` and
# `repo` guard the claims the other jobs structurally cannot see: the declared Rust
# floor, the version written down in three files, and the generated tray icons.
# `cargo-deny`, `dependency-review` (pull requests only) and `zizmor` are the supply
# chain: advisories and licences for the dependency tree, and the workflows themselves.
#
# `installers` is off unless asked for: a manual run with `build_installers` ticked
# builds the four unsigned bundles a release would ship and keeps them for 3 days,
# which is how a build gets tested from a private staging repo without a tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_installers:
        description: Also build unsigned installers (dmg x2, deb, AppImage), kept 3 days
        type: boolean
        default: false

# Least privilege at the top level so a job added later starts read-only instead of
# inheriting the repository's default token scope. The only write in CI is `zizmor`'s
# `security-events`, granted on that job alone to upload its SARIF.
permissions:
  contents: read

# Per ref. The event name is part of the group so a manual installer run on main is
# not cancelled by the next push to main (or the reverse), and only pull requests
# cancel in flight: a superseded PR run is waste, a superseded main run is history.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Tauri on Linux links against GTK/WebKitGTK, so `cargo clippy` and `cargo check`
  # fail at BUILD time without these, not just at bundle time.
  #   libwebkit2gtk-4.1 / libjavascriptcoregtk-4.1 / libsoup-3.0  the webview (Tauri 2 line)
  #   libgtk-3                                                    windowing
  #   libayatana-appindicator3                                    the tray icon
  #   librsvg2                                                    SVG icon rendering
  #   patchelf, xdg-utils                                         AppImage bundling
  #
  # ⛔ libssl-dev is deliberately NOT here. reqwest is built with
  # `default-features = false` and the `rustls` feature: `openssl-sys` and `native-tls`
  # appear nowhere in Cargo.lock (which is platform-independent, so that settles every
  # target). Kept in step with release.yml's copy.
  LINUX_TAURI_DEPS: >-
    libwebkit2gtk-4.1-dev
    libjavascriptcoregtk-4.1-dev
    libsoup-3.0-dev
    libgtk-3-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    patchelf
    xdg-utils

jobs:
  # fmt, clippy -D warnings, the workspace tests and a check of the Tauri shell, on
  # the two platforms a release builds on.
  #
  # ⛔ LINUX RUNS ON ubuntu-22.04, NOT 24.04, BECAUSE 22.04 IS THE RELEASE FLOOR.
  # glibc is forward- and not backward-compatible and 22.04 ships an older WebKitGTK,
  # so release.yml links on 22.04 and this job is where that floor is exercised on
  # every push rather than first at tag time. Moving it is a user-visible change.
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # deliberate word splitting into one package per arg
          sudo apt-get install -y $LINUX_TAURI_DEPS

      # rustup is preinstalled on every GitHub-hosted image, and rust-toolchain.toml
      # already names the channel and components, so no third-party action is needed.
      # The install is explicit anyway (it also UPDATES a stale preinstalled stable),
      # because recent rustup releases have gone back and forth on auto-installing
      # from the toolchain file. The x86_64 target is for the Intel cross-check below.
      - name: Install the stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          if [ "$RUNNER_OS" = macOS ]; then rustup target add x86_64-apple-darwin --toolchain stable; fi
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rust-${{ matrix.os }}

      # Formatting does not depend on the platform; once is enough.
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # `--locked` on every cargo call that resolves: it fails if Cargo.lock would
      # have to change. --all-targets so the fixture tests are linted too.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `--workspace`, not a list of packages: a crate never named here runs zero tests
      # and looks identical to a crate whose tests all pass.
      - name: cargo test
        run: cargo test --workspace --locked

      # The shell on its own, named, so a failure reads as "the app does not build on
      # <os>" rather than being buried in a workspace-wide clippy log. No frontend
      # build is needed first: without the `custom-protocol` feature (which only the
      # Tauri CLI adds) tauri-codegen embeds no assets and never reads ../dist.
      - name: cargo check -p bridgewatch-app
        run: cargo check -p bridgewatch-app --locked

      # release.yml cross-compiles the Intel .dmg from this same Apple Silicon image.
      # That is the leg most likely to fail for a reason the native build cannot show,
      # so it is checked here rather than first at tag time.
      - name: cargo check -p bridgewatch-app (x86_64-apple-darwin)
        if: runner.os == 'macOS'
        run: cargo check -p bridgewatch-app --locked --target x86_64-apple-darwin

  # The declared Rust floor, compiled at the floor. Without this job `rust-version`
  # is a comment: CI builds on stable, so a feature stabilised after the declared
  # version compiles green forever and only a user on the floor finds out.
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # deliberate word splitting into one package per arg
          sudo apt-get install -y $LINUX_TAURI_DEPS

      # One source of truth: the floor is read out of the manifest (1.88 today) rather
      # than duplicated here, so bumping Cargo.toml bumps this job.
      - name: Read the declared MSRV
        id: msrv
        run: |
          msrv="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["rust-version"])')"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "declared rust-version: $msrv"

      # ⛔ INSTALLING THE FLOOR IS NOT ENOUGH ON ITS OWN, AND THE FAILURE IS SILENT.
      # rustup's override order puts rust-toolchain.toml (which pins `stable`) above
      # the default toolchain, so every cargo call here would run on stable and the job
      # would pass while proving nothing. RUSTUP_TOOLCHAIN outranks the file; exporting
      # it through $GITHUB_ENV applies it to the cache action too.
      - name: Install the MSRV toolchain and pin it above rust-toolchain.toml
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.msrv }}

      # And assert it rather than trusting it.
      - name: The active compiler really is the floor
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
        run: |
          have="$(rustc --version | cut -d' ' -f2)"
          case "$have" in
            "$MSRV" | "$MSRV".*)
              echo "rustc $have honours the declared MSRV $MSRV" ;;
            *)
              echo "::error::rustc is $have, but the declared MSRV is $MSRV. The toolchain pin is not taking effect."
              exit 1 ;;
          esac

      # `check`, not `build`: MSRV is a question about the language and the dependency
      # manifests, and --all-targets extends it to the test files.
      - name: cargo check at the MSRV
        run: cargo check --workspace --all-targets --locked

  # Seconds of runtime; both checks need python >= 3.11 (tomllib), which is one reason
  # this is not on the 22.04 leg (python 3.10 there).
  repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Written in Cargo.toml, package.json and tauri.conf.json, and nothing derives
      # one from another. The only thing that catches a partial bump.
      - name: The three version literals agree
        run: python3 scripts/check-version.py

      # Stdlib-only regeneration check of the committed tray PNGs. Byte equality rests
      # on level-9 deflate agreeing across zlib versions; measured on 2026-09-17 to hold
      # on zlib 1.3.1 (Debian) and 1.2.12 (macOS), with a positive control. If a future
      # zlib changes it, regenerate and commit; do not weaken the check.
      - name: Tray icons are generated, not hand-edited
        run: python3 src-tauri/icons/generate.py --check

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Plain tsc over the .ts files plus a build of the referenced node project
      # (vite/vitest/svelte config). svelte-check tolerates TS6305/TS2688 in the
      # project graph, so it is not a substitute.
      - name: tsc
        run: npm run typecheck

      # svelte-check: TypeScript plus Svelte template types, the only thing that
      # type-checks the markup.
      - name: svelte-check
        run: npm run check

      # The vitest suite, including the Settings registry <-> JSON Schema parity gate.
      # Invoked directly rather than through `npm test` so this step does not depend on
      # a script name.
      - name: vitest
        run: npx vitest run

      # ⚠️ The production bundle, which is where Tailwind v4 (@tailwindcss/vite) actually
      # compiles. Nothing above runs it: vitest and svelte-check never produce CSS, so a
      # broken @import, @theme or unknown utility would otherwise first fail inside
      # `tauri build` at tag time. This is also Tauri's `beforeBuildCommand`.
      - name: vite build (Tailwind)
        run: npm run build

  # RustSec advisories, the licence allow-list, banned crates and allowed sources, all
  # read from deny.toml. RustSec often has an advisory days before GitHub's database,
  # so this is not a duplicate of Dependabot. The binary is the upstream release,
  # checked against a pinned SHA-256 rather than a third-party install action, so the
  # org's action allow-list stays short.
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${name}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version

      - name: cargo deny check
        run: cargo deny --locked check

  # Pull requests only: fails a PR that ADDS a dependency (any ecosystem, including
  # an action) with a known moderate-or-worse vulnerability, or under a licence this
  # Apache-2.0 project cannot ship. Mostly a guard on Dependabot's own PRs.
  # cargo-deny holds the complete licence allow-list for the Rust tree; GitHub's
  # licence detection for crates is patchy, so this is a deny-list backstop that also
  # covers npm.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1

  # Static analysis of these workflows themselves: template injection, over-broad
  # token permissions, credential persistence, cache poisoning on the release path.
  # Complements CodeQL's Actions queries. Two modes, because SARIF mode suppresses
  # zizmor's exit codes and a fork's pull request cannot upload SARIF at all:
  #   push / schedule / dispatch  SARIF to code scanning (category `zizmor`), no gate
  #   pull_request                annotations, and the job FAILS on a finding, which
  #                               is what the `main` ruleset's required check enforces
  # Suppressions are inline `# zizmor: ignore[...]` comments with a reason.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Upload the SARIF to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: ${{ github.event_name != 'pull_request' }}
          annotations: ${{ github.event_name == 'pull_request' }}

  # Manual only. The same bundles release.yml builds, from any ref, UNSIGNED, as
  # workflow artifacts with 3-day retention: for installing a candidate from a private
  # staging repo. Nothing here creates a release, a tag or an attestation.
  installers:
    if: github.event_name == 'workflow_dispatch' && inputs.build_installers
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-aarch64
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            bundle_dir: target/aarch64-apple-darwin/release/bundle
            expected: 1
          - id: macos-x86_64
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            bundle_dir: target/x86_64-apple-darwin/release/bundle
            expected: 1
          - id: linux-x86_64
            platform: ubuntu-22.04
            args: ''
            rust_target: ''
            bundle_dir: target/release/bundle
            expected: 2
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # deliberate word splitting into one package per arg
          sudo apt-get install -y $LINUX_TAURI_DEPS

      - name: Install the stable toolchain
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          # Components match rust-toolchain.toml so rustup has nothing left to fetch.
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          if [ -n "$RUST_TARGET" ]; then rustup target add "$RUST_TARGET" --toolchain stable; fi
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: installers-${{ matrix.id }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cargo.lock is up to date
        run: cargo fetch --locked

      - name: Build the bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # ⛔ See release.yml: "true" (the action's default) runs create-dmg's Finder
          # AppleScript on a headless runner, the classic hours-long hang.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
        with:
          # No tagName and no releaseId: the action only builds, uploads nothing.
          args: ${{ matrix.args }}

      # tauri-action exits 0 when it finds no artifacts and was not asked to upload,
      # so the count is asserted here.
      - name: Stage this leg's bundles
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          EXPECTED: ${{ matrix.expected }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          find "$BUNDLE_DIR" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} staging/ \;
          found="$(find staging -type f | wc -l | tr -d ' ')"
          if [ "$found" -ne "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED bundle(s) under $BUNDLE_DIR, staged $found"
            find "$BUNDLE_DIR" -maxdepth 3 || true
            exit 1
          fi
          ls -l staging

      # The core shells out to `secret-tool` on Linux, so a .deb without this
      # dependency installs cleanly and then cannot read a keyring token.
      - name: The .deb depends on libsecret-tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          depends="$(dpkg-deb -f staging/*.deb Depends)"
          echo "Depends: $depends"
          grep -qw libsecret-tools <<<"$depends" || { echo "::error::the .deb does not depend on libsecret-tools"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-installers-${{ matrix.id }}
          path: staging/
          if-no-files-found: error
          retention-days: 3
          # The bundles are already compressed.
          compression-level: 0
