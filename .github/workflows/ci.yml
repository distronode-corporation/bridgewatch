name: CI

# bridgewatch is two halves that break independently: a pure-Rust core crate
# (crates/bridgewatch-core, no Tauri dependency, fixture-tested) and a Tauri 2 shell
# around a Svelte 5 frontend. `rust` covers the Rust workspace on both release
# platforms, `frontend` the Svelte half including the Tailwind build, and `msrv` and
# `repo` guard the claims the other jobs structurally cannot see: the declared Rust
# floor, the version written down in two files, and the generated tray icons.
# `cargo-deny`, `dependency-review` (pull requests only) and `zizmor` are the supply
# chain: advisories and licences for the dependency tree, and the workflows themselves.
# `cli` builds the command-line binary the way a release ships it, packs the npm
# package around it and runs it through the shim, and on macOS proves the
# hardened-runtime binary still reads the keychain. `npm-rehearsal` then runs the
# release's own packaging scripts on the three binaries: the tarballs, the staged npm
# package, the pack checks and `npm publish --dry-run`. `launcher` runs the npm
# launcher's tests on every Node the package admits.
#
# `installers` is off unless asked for: a manual run with `build_installers` ticked
# builds the seven unsigned app bundles a release would ship (not the CLI tarballs,
# which `cli` covers) and keeps them for 3 days, which is how a build gets tested
# from a private staging repo without a tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_installers:
        description: Also build unsigned installers (universal dmg; deb, rpm, AppImage on x86_64 and arm64), kept 3 days
        type: boolean
        default: false

# Least privilege at the top level so a job added later starts read-only instead of
# inheriting the repository's default token scope. The only write in CI is `zizmor`'s
# `security-events`, granted on that job alone to upload its SARIF.
permissions:
  contents: read

# Per ref. The event name is part of the group so a manual installer run on main is
# not cancelled by the next push to main (or the reverse), and only pull requests
# cancel in flight: a superseded PR run is waste, a superseded main run is history.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Steps this workflow shares with release.yml and audit.yml live as local composite
# actions under .github/actions/ (the Tauri apt list, the pinned cargo-deny install,
# bundle staging and the bundle checks), so each is written once. They are called
# with GitHub's self-repository syntax, `uses: $/...`, which resolves to this
# repository at the commit that is running whatever the workspace holds (zizmor's
# `self-repository` audit fails the `./` form). No secret is passed into any of them.

jobs:
  # fmt, clippy -D warnings, the workspace tests and a check of the Tauri shell, on
  # the three runners a release builds on.
  #
  # ⛔ LINUX RUNS ON ubuntu-22.04 AND ubuntu-22.04-arm, NOT 24.04, BECAUSE THE RUNNER
  # IS THE RELEASE's glibc FLOOR. glibc is forward- and not backward-compatible and
  # 22.04 ships an older WebKitGTK, so release.yml links on these two images (the
  # oldest GitHub offers per architecture) and this job is where that floor is
  # exercised on every push rather than first at tag time. Moving either is a
  # user-visible change.
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        uses: $/.github/actions/linux-tauri-deps

      # rustup is preinstalled on every GitHub-hosted image, and rust-toolchain.toml
      # already names the channel and components, so no third-party action is needed.
      # The install is explicit anyway (it also UPDATES a stale preinstalled stable),
      # because recent rustup releases have gone back and forth on auto-installing
      # from the toolchain file. The x86_64 target is for the Intel cross-check below;
      # macos-latest is arm64, so the native steps already cover the other half of the
      # universal .dmg.
      - name: Install the stable toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          if [ "$RUNNER_OS" = macOS ]; then rustup target add x86_64-apple-darwin --toolchain stable; fi
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-${{ matrix.os }}

      # Formatting does not depend on the platform; once is enough.
      - name: cargo fmt
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt --all --check

      # `--locked` on every cargo call that resolves: it fails if Cargo.lock would
      # have to change. --all-targets so the fixture tests are linted too.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # `--workspace`, not a list of packages: a crate never named here runs zero tests
      # and looks identical to a crate whose tests all pass.
      - name: cargo test
        run: cargo test --workspace --locked

      # The shell on its own, named, so a failure reads as "the app does not build on
      # <os>" rather than being buried in a workspace-wide clippy log. No frontend
      # build is needed first: without the `custom-protocol` feature (which only the
      # Tauri CLI adds) tauri-codegen embeds no assets and never reads ../dist.
      - name: cargo check -p bridgewatch-app
        run: cargo check -p bridgewatch-app --locked

      # release.yml's universal .dmg cross-compiles its Intel half from this same Apple
      # Silicon image. That is the half most likely to fail for a reason the native
      # build cannot show, so it is checked here rather than first at tag time.
      - name: cargo check -p bridgewatch-app (x86_64-apple-darwin)
        if: runner.os == 'macOS'
        run: cargo check -p bridgewatch-app --locked --target x86_64-apple-darwin

  # The declared Rust floor, compiled at the floor. Without this job `rust-version`
  # is a comment: CI builds on stable, so a feature stabilised after the declared
  # version compiles green forever and only a user on the floor finds out.
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        uses: $/.github/actions/linux-tauri-deps

      # One source of truth: the floor is read out of the manifest (1.90 today) rather
      # than duplicated here, so bumping Cargo.toml bumps this job.
      - name: Read the declared MSRV
        id: msrv
        run: |
          msrv="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["rust-version"])')"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "declared rust-version: $msrv"

      # ⛔ INSTALLING THE FLOOR IS NOT ENOUGH ON ITS OWN, AND THE FAILURE IS SILENT.
      # rustup's override order puts rust-toolchain.toml (which pins `stable`) above
      # the default toolchain, so every cargo call here would run on stable and the job
      # would pass while proving nothing. RUSTUP_TOOLCHAIN outranks the file; exporting
      # it through $GITHUB_ENV applies it to the cache action too.
      - name: Install the MSRV toolchain and pin it above rust-toolchain.toml
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.msrv }}

      # And assert it rather than trusting it.
      - name: The active compiler really is the floor
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
        run: |
          have="$(rustc --version | cut -d' ' -f2)"
          case "$have" in
            "$MSRV" | "$MSRV".*)
              echo "rustc $have honours the declared MSRV $MSRV" ;;
            *)
              echo "::error::rustc is $have, but the declared MSRV is $MSRV. The toolchain pin is not taking effect."
              exit 1 ;;
          esac

      # `check`, not `build`: MSRV is a question about the language and the dependency
      # manifests, and --all-targets extends it to the test files.
      - name: cargo check at the MSRV
        run: cargo check --workspace --all-targets --locked

  # Seconds of runtime; both checks need python >= 3.11 (tomllib), which is one reason
  # this is not on the 22.04 leg (python 3.10 there).
  repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Written in Cargo.toml and package.json, and neither derives from the other
      # (tauri.conf.json carries none, so the bundles take Cargo.toml's; the script
      # refuses one reappearing). The only thing that catches a partial bump.
      - name: The two version literals agree
        run: python3 scripts/check-version.py

      # Stdlib-only regeneration check of the committed tray PNGs. Byte equality rests
      # on level-9 deflate agreeing across zlib versions; measured on 2026-09-17 to hold
      # on zlib 1.3.1 (Debian) and 1.2.12 (macOS), with a positive control. If a future
      # zlib changes it, regenerate and commit; do not weaken the check.
      - name: Tray icons are generated, not hand-edited
        run: python3 src-tauri/icons/generate.py --check

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Plain tsc over the .ts files plus a build of the referenced node project
      # (vite/vitest/svelte config). svelte-check tolerates TS6305/TS2688 in the
      # project graph, so it is not a substitute.
      - name: tsc
        run: npm run typecheck

      # svelte-check: TypeScript plus Svelte template types, the only thing that
      # type-checks the markup.
      - name: svelte-check
        run: npm run check

      # The vitest suite, including the Settings registry <-> JSON Schema parity gate.
      # Invoked directly rather than through `npm test` so this step does not depend on
      # a script name.
      - name: vitest
        run: npx vitest run

      # ⚠️ The production bundle, which is where Tailwind v4 (@tailwindcss/vite) actually
      # compiles. Nothing above runs it: vitest and svelte-check never produce CSS, so a
      # broken @import, @theme or unknown utility would otherwise first fail inside
      # `tauri build` at tag time. This is also Tauri's `beforeBuildCommand`.
      - name: vite build (Tailwind)
        run: npm run build

  # RustSec advisories, the licence allow-list, banned crates and allowed sources, all
  # read from deny.toml. RustSec often has an advisory days before GitHub's database,
  # so this is not a duplicate of Dependabot. The binary is the upstream release,
  # checked against a pinned SHA-256 (the version and digest live in
  # .github/actions/install-cargo-deny, shared with audit.yml) rather than a
  # third-party install action, so the org's action allow-list stays short.
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: $/.github/actions/install-cargo-deny

      - name: cargo deny check
        run: cargo deny --locked check

  # Pull requests only: fails a PR that ADDS a dependency (any ecosystem, including
  # an action) with a known moderate-or-worse vulnerability, or under a licence this
  # Apache-2.0 project cannot ship. Mostly a guard on Dependabot's own PRs.
  # cargo-deny holds the complete licence allow-list for the Rust tree; GitHub's
  # licence detection for crates is patchy, so this is a deny-list backstop that also
  # covers npm.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1

  # Static analysis of these workflows themselves: template injection, over-broad
  # token permissions, credential persistence, cache poisoning on the release path.
  # Complements CodeQL's Actions queries. Two modes, because SARIF mode suppresses
  # zizmor's exit codes and a fork's pull request cannot upload SARIF at all:
  #   push / schedule / dispatch  SARIF to code scanning (category `zizmor`), no gate
  #   pull_request                annotations, and the job FAILS on a finding, which
  #                               is what the `main` ruleset's required check enforces
  # Suppressions are inline `# zizmor: ignore[...]` comments with a reason.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Upload the SARIF to code scanning.
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          advanced-security: ${{ github.event_name != 'pull_request' }}
          annotations: ${{ github.event_name == 'pull_request' }}

  # The CLI as a release ships it, on every push and pull request: the same build step
  # release.yml runs (fully stripped; universal on macOS), the npm package packed
  # around it, and the binary run through the package's shim. `installers` covers the
  # app bundles but is manual only, so without this job the first build of the CLI
  # tarballs and the npm package would be at tag time.
  #
  # On macOS the binary is also signed ad hoc with the hardened runtime, the flag
  # release.yml's Developer ID signature carries, and made to read a token from a
  # throwaway keychain item through `security find-generic-password`. No secret is
  # used anywhere in this job.
  #
  # ⛔ Same runners as `rust`, for the same reason: ubuntu-22.04 and -arm are the
  # release's glibc floor, which packaging/npm/bin/bridgewatch.js also enforces.
  cli:
    name: cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: universal-apple-darwin
            os: macos-latest
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            rust_targets: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before anything slow: packaging/npm is what the last three steps pack, and a
      # missing one should read as that, not as an npm error twenty minutes in.
      - name: The npm package exists
        run: |
          if [ ! -f packaging/npm/package.json ]; then
            echo "::error::packaging/npm/package.json is missing, so there is no npm package to pack around the CLI"
            exit 1
          fi

      # No Tauri apt list: the CLI does not link GTK or WebKitGTK, and its Linux
      # keyring backend (zbus) is pure Rust.
      - name: Install the stable toolchain
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          # Components match rust-toolchain.toml so rustup has nothing left to fetch.
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          # Space-separated; empty on the native Linux legs.
          for t in $RUST_TARGETS; do rustup target add "$t" --toolchain stable; done
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cli-${{ matrix.target }}

      # The version the binary must report, from the crate that defines it
      # (python 3.10 on the 22.04 legs, so json rather than tomllib).
      - name: Read the CLI version
        id: version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys;print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="bridgewatch-cli"))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bridgewatch-cli $version"

      - name: Build the CLI
        uses: $/.github/actions/build-cli
        with:
          target: ${{ matrix.target }}
          version: ${{ steps.version.outputs.version }}

      # For `npm-rehearsal`. upload-artifact drops the mode; the packaging script sets
      # 0755 itself, as it does at release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: cli-out/bridgewatch
          if-no-files-found: error
          retention-days: 1

      # The identifier and flags release.yml signs with, minus the Developer ID: an ad
      # hoc signature carries the hardened runtime just the same, which is the part
      # the probe is about.
      - name: Sign ad hoc with the hardened runtime
        if: runner.os == 'macOS'
        run: codesign --force --options runtime --identifier com.distronode.bridgewatch.cli --sign - cli-out/bridgewatch

      # The CLI a 1.x user has, for the bound-token probe below: what it does with an
      # entry 2.0 wrote is part of the claim. Checked against a pinned digest.
      - name: Fetch the released 1.3.0 CLI
        id: released
        env:
          TARGET: ${{ matrix.target }}
          # For the REST API fallback's rate limit only; the job stays contents: read.
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$(bash .github/scripts/fetch-released-cli.sh "$TARGET" "$RUNNER_TEMP/released")"
          echo "cli=$bin" >> "$GITHUB_OUTPUT"

      # keyring-crate: also the in-process Security.framework path that `auth login`,
      # `auth status` and `auth logout` use, and the own-token binding
      # (.github/scripts/bound-token-probe.sh). CI only, so a surprise there fails a
      # PR rather than a tag.
      - name: The hardened-runtime CLI reads the keychain
        if: runner.os == 'macOS'
        uses: $/.github/actions/cli-keychain-probe
        with:
          binary: cli-out/bridgewatch
          keyring-crate: "true"
          released-cli: ${{ steps.released.outputs.cli }}

      # The same binding probe against the Secret Service: a throwaway gnome-keyring
      # on a private D-Bus session, with a temporary HOME and XDG_RUNTIME_DIR (the
      # script sets them up).
      - name: Own tokens stay with their server (Secret Service)
        if: runner.os == 'Linux'
        env:
          RELEASED_CLI: ${{ steps.released.outputs.cli }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dbus gnome-keyring libsecret-tools
          bash .github/scripts/bound-token-probe.sh cli-out/bridgewatch "$RELEASED_CLI"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Only this leg's binary goes into vendor/; the shim picks it by platform and
      # architecture, so the other two targets' absence is not exercised here.
      - name: Pack the npm package around the CLI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # mkdir, not `install -D`: on macOS (BSD install) -D names a destdir and creates
          # nothing.
          mkdir -p "packaging/npm/vendor/$TARGET"
          install -m 0755 cli-out/bridgewatch "packaging/npm/vendor/$TARGET/bridgewatch"
          cd packaging/npm
          npm pack
          shopt -s nullglob
          packed=(bridgewatch-*.tgz)
          if [ "${#packed[@]}" -ne 1 ]; then
            echo "::error::expected one bridgewatch-*.tgz, npm pack left ${#packed[@]}"
            exit 1
          fi
          # In the tarball, and executable there: a 0644 binary installs and then
          # fails with EACCES on first run.
          entry="$(tar -tvzf "${packed[0]}" "package/vendor/$TARGET/bridgewatch")"
          echo "$entry"
          case "$entry" in
            -rwxr-xr-x*) ;;
            *) echo "::error::vendor/$TARGET/bridgewatch is not 0755 in the tarball"; exit 1 ;;
          esac

      - name: The packed CLI runs through the shim
        working-directory: packaging/npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          reported="$(npx --yes ./bridgewatch-*.tgz --version)"
          if [ "$reported" != "bridgewatch $VERSION" ]; then
            echo "::error::npx bridgewatch reports \"$reported\", expected \"bridgewatch $VERSION\""
            exit 1
          fi
          echo "$reported"

  # The release's CLI packaging and npm steps, rehearsed on every push and pull
  # request with the SAME scripts release.yml runs (.github/scripts/package-cli.sh,
  # npm-stage.sh, npm-pack.sh), so a bug in them is found here rather than at a tag,
  # where a re-run replays the tag's own YAML and a fix costs a new version. The
  # inputs differ from a release's only in what they cannot share: the binaries are
  # the `cli` legs' (the macOS one signed ad hoc, not with the Developer ID), and the
  # third-party licence file is a stand-in, because cargo-about runs in release.yml's
  # `licenses` job. Nothing is published: `npm publish --dry-run` needs no login.
  npm-rehearsal:
    needs: cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: ${{ runner.temp }}/bin

      - name: The three release tarballs
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packaging/npm/package.json").version')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          printf 'Stand-in for the cargo-about output release.yml generates.\n' \
            > "$RUNNER_TEMP/THIRD-PARTY-LICENSES-cli.txt"
          for t in universal-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            bash .github/scripts/package-cli.sh "$version" "$t" "$RUNNER_TEMP/bin/cli-$t/bridgewatch" \
              "$RUNNER_TEMP/THIRD-PARTY-LICENSES-cli.txt" "$RUNNER_TEMP/tarballs"
          done

      - name: Stage the npm package
        run: bash .github/scripts/npm-stage.sh "$VERSION" "$RUNNER_TEMP/tarballs"

      - name: Pack and check the npm package
        run: bash .github/scripts/npm-pack.sh "$VERSION" "$RUNNER_TEMP/npm"

      # npm refuses even a dry run over a version it already has, so once a release is
      # published every PR until the next version bump would fail here. Then the pack and
      # check steps above are the rehearsal; a release PR bumps the version and runs the
      # full dry run.
      - name: npm publish --dry-run
        run: |
          set -euo pipefail
          if [ "$(npm view "bridgewatch@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::bridgewatch@$VERSION is already published, so the registry refuses a dry run over it; the pack and check steps above ran."
          else
            npm publish --dry-run "$RUNNER_TEMP/npm/bridgewatch-$VERSION.tgz"
          fi

  # The npm launcher's tests (platform mapping, the musl and old-glibc refusals, the
  # diagnostic report, exit codes, signals, the packed file list), on every Node major
  # the package's `engines` admits (>=18). node:test, because vitest only collects
  # src/**. The glob is left to the shell: Node 18 and 20 do not expand one passed to
  # `--test`, and Node 22 and later read a bare directory as a module.
  launcher:
    name: launcher (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: node --test
        run: node --test packaging/npm/test/*.test.js

  # Manual only. The same bundles release.yml builds, from any ref, UNSIGNED, as
  # workflow artifacts with 3-day retention: for installing a candidate from a private
  # staging repo. Nothing here creates a release, a tag or an attestation.
  installers:
    if: github.event_name == 'workflow_dispatch' && inputs.build_installers
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kept in step with release.yml's matrix, including its glibc-floor runners.
          # (The matrix stays written out in both files on purpose: release.yml is the
          # signed path and keeps its build job self-contained rather than a reusable
          # workflow shared with an unsigned manual build.)
          - id: macos-universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle
            expected: 1
          - id: linux-x86_64
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
            bundle_dir: target/release/bundle
            expected: 3
          - id: linux-aarch64
            platform: ubuntu-22.04-arm
            args: ''
            rust_targets: ''
            bundle_dir: target/release/bundle
            expected: 3
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        uses: $/.github/actions/linux-tauri-deps

      - name: Install the stable toolchain
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          # Components match rust-toolchain.toml so rustup has nothing left to fetch.
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          # Space-separated; empty on the native Linux legs.
          for t in $RUST_TARGETS; do rustup target add "$t" --toolchain stable; done
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installers-${{ matrix.id }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cargo.lock is up to date
        run: cargo fetch --locked

      - name: Build the bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # ⛔ See release.yml: "true" (the action's default) runs create-dmg's Finder
          # AppleScript on a headless runner, the classic hours-long hang.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
        with:
          # No tagName and no releaseId: the action only builds, uploads nothing.
          args: ${{ matrix.args }}

      # tauri-action exits 0 when it finds no artifacts and was not asked to upload,
      # so the count is asserted here.
      - name: Stage this leg's bundles
        uses: $/.github/actions/stage-bundles
        with:
          bundle-dir: ${{ matrix.bundle_dir }}
          expected: ${{ matrix.expected }}

      # Unsigned here, so only the architecture half of release.yml's macOS checks.
      - name: The .app is universal
        if: runner.os == 'macOS'
        uses: $/.github/actions/dmg-is-universal

      - name: The .deb and .rpm depend on secret-tool
        if: runner.os == 'Linux'
        uses: $/.github/actions/linux-packages-need-secret-tool

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installers-${{ matrix.id }}
          path: staging/
          if-no-files-found: error
          retention-days: 3
          # The bundles are already compressed.
          compression-level: 0
