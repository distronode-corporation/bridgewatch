name: Scorecard

# OpenSSF Scorecard: the third-party read of this repository's supply-chain posture
# (pinned actions, token permissions, branch protection, signed releases, and so on).
# Results go to code scanning as SARIF and are published to the public Scorecard API,
# which is what the README badge reads. Same shape as the sibling fork
# distronode-corporation/district-scheduler.
#
# Not on pull requests: scorecard-action documents that trigger as experimental, and
# publishing needs `id-token: write`, which means nothing on a PR.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday, so a check that decays with time still reports
  workflow_dispatch:

# Nothing at the top level, so a job added here later starts with no token scope at all.
# The job below grants itself exactly what it uses.
permissions: {}

# One run at a time per ref; a second run queues rather than cancelling the first, so a
# publish that has started always finishes.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published result, so the public API can tell it came from this repo.
      id-token: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # A read-only token (Administration and Metadata) so the Branch-Protection check
          # can read the rulesets; the default job token cannot. Falls back to the default
          # job token when the secret is not set, since an explicitly passed empty value
          # would not be replaced by the action's own default.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
