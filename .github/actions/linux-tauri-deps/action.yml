name: Install Tauri system dependencies
description: The apt packages the Tauri shell needs to build and bundle on Linux.

# One list for every Linux job that builds the shell: ci.yml's `rust`, `msrv` and
# `installers`, and release.yml's `build`. Linux runners only; the callers gate it on
# `runner.os == 'Linux'`.
#
# Tauri on Linux links against GTK/WebKitGTK, so `cargo clippy` and `cargo check`
# fail at BUILD time without these, not just at bundle time.
#   libwebkit2gtk-4.1 / libjavascriptcoregtk-4.1 / libsoup-3.0  the webview (Tauri 2 line)
#   libgtk-3                                                    windowing
#   libayatana-appindicator3                                    the tray icon
#   librsvg2                                                    SVG icon rendering
#   patchelf, xdg-utils                                         AppImage bundling
#
# ⛔ libssl-dev is deliberately NOT here. reqwest is built with
# `default-features = false` and the `rustls` feature: `openssl-sys` and `native-tls`
# appear nowhere in Cargo.lock (which is platform-independent, so that settles every
# target).
#
# ⛔ No `uses:` in here, on purpose: dependabot.yml's github-actions entry scans only
# `.github/workflows`, so a pinned action inside a local composite action would never
# be bumped.
runs:
  using: composite
  steps:
    - name: apt-get install
      shell: bash
      # ⛔ THE RUNNER'S FIRST MIRROR IS NOT ALWAYS A GOOD ONE. GitHub's x64 Ubuntu
      # runners read the archive through `mirror+file:/etc/apt/apt-mirrors.txt`, and
      # the first entry depends on where the runner landed: azure.archive.ubuntu.com on
      # Azure, us-east-2.ec2.archive.ubuntu.com on the ubuntu-24.04 runners GitHub now
      # also places in AWS us-west-2 and us-east-1. That EC2 mirror either crawls (72 MB
      # at 70 to 260 kB/s) or fails each file, and apt falls back to archive.ubuntu.com,
      # which crawled too (36 to 80 kB/s). apt never leaves a mirror that is slow but
      # answering, so the step took 4 to 35 minutes instead of under one on 26 of the
      # 34 such runs in 40 CI runs (msrv and coverage), and the same fallback crawl
      # hit the Azure mirror now and then.
      #
      # So: time each mirror on the same real package, a 1.4 MB .deb, and put the
      # fastest first (an InRelease is a few hundred kB, too small to tell a crawl from a
      # good mirror), then download under a watchdog. Each try is cut when it runs over
      # its time limit, or when fewer than 1 MB arrive in 30 s: the first mirror goes to
      # the back of the list, and the next try resumes from the files already in
      # /var/cache/apt/archives, partial ones included. Only the download is watched,
      # never dpkg: the install that follows reads the local cache and is never killed
      # half way.
      run: |
        set -euo pipefail
        # ⛔ Only the Ubuntu archives. The image also lists packages.microsoft.com,
        # whose InRelease answers 403 now and then, and one failed source fails the
        # whole `apt-get update`. Nothing here comes from it, so it is dropped rather
        # than retried. (grep finds nothing on an image without it: no-op.)
        { sudo grep -lrs --null packages.microsoft.com /etc/apt/sources.list.d/ || true; } | xargs -0r sudo rm -f --
        pkgs=(
          libwebkit2gtk-4.1-dev
          libjavascriptcoregtk-4.1-dev
          libsoup-3.0-dev
          libgtk-3-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf
          xdg-utils
        )
        # A stalled connection is retried, then the next mirror is tried.
        apt=(apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        list=/etc/apt/apt-mirrors.txt
        # The timing sample: noble's release coreutils, 1,412,418 bytes. A release
        # pocket's files stay in the pool for the release's life, at this same path on
        # every Ubuntu mirror.
        sample=pool/main/c/coreutils/coreutils_9.4-3ubuntu6_amd64.deb

        write_list() { # mirror URLs on stdin, best first
          awk 'NF && !seen[$1]++ { printf "%s\tpriority:%d\n", $1, ++n }' | sudo tee "$list" > /dev/null
        }

        # x64 only: azure.archive.ubuntu.com carries no arm64, and the arm runners'
        # mirror has not been slow.
        if [ -f "$list" ] && [ "$(dpkg --print-architecture)" = amd64 ]; then
          ranked="$(
            { cut -f1 "$list"; echo http://azure.archive.ubuntu.com/ubuntu/; } | awk 'NF && !seen[$1]++' |
              while read -r url; do
                # 6 s each: a mirror too slow to send 1.4 MB in that time is ranked by
                # what it did send (curl reports the speed of a cut transfer too).
                read -r code speed < <(curl -sS -o /dev/null --max-time 6 -w '%{http_code} %{speed_download}\n' \
                  "${url%/}/$sample" 2> /dev/null || echo "000 0")
                [ "$code" = 200 ] || speed=0
                echo "$speed $url"
              done | sort -g -r
          )"
          echo "Mirrors by download speed of a 1.4 MB package (bytes/s):"
          echo "$ranked"
          awk '{ print $2 }' <<< "$ranked" | write_list
        fi

        # The bytes apt has fetched so far: package lists and packages, partial files too.
        fetched() {
          sudo du -sb /var/lib/apt/lists /var/cache/apt/archives 2> /dev/null | awk '{ s += $1 } END { print s + 0 }'
        }

        # Runs apt (as root) under a watchdog: killed after `limit` seconds, or when fewer
        # than 1 MB arrived in the last 30 s. 0 means no limit and no watchdog. apt is
        # exec'd under a known pid, so the kill reaches apt itself whatever sudo's pty
        # does, and its http methods end with it.
        watched() {
          local limit=$1
          shift
          local pidfile="$RUNNER_TEMP/apt-watched.pid"
          if [ "$limit" -eq 0 ]; then
            sudo "${apt[@]}" "$@"
            return
          fi
          rm -f "$pidfile"
          # shellcheck disable=SC2016 # $$ and $0 are the root shell's, on purpose
          sudo bash -c 'echo "$$" > "$0"; exec "$@"' "$pidfile" "${apt[@]}" "$@" &
          local job=$! start=$SECONDS
          local -a samples=()
          # Not `kill -0`: the job is sudo, a root process this user may not signal.
          running() { [[ " $(jobs -rp) " == *" $job "* ]]; }
          while running; do
            sleep 5
            samples+=("$(fetched)")
            local n=${#samples[@]} why=""
            if [ $((SECONDS - start)) -ge "$limit" ]; then
              why="ran over ${limit}s"
            elif [ "$n" -gt 6 ] && [ $((samples[n - 1] - samples[n - 7])) -lt 1048576 ]; then
              why="fetched under 1 MB in 30 s"
            fi
            if [ -n "$why" ] && running; then
              echo "::warning::apt $1 $why: stopped"
              [ -s "$pidfile" ] && sudo kill -TERM "$(cat "$pidfile")" 2> /dev/null || true
              wait "$job" 2> /dev/null || true
              return 124
            fi
          done
          wait "$job"
        }

        # Two watched tries (2 minutes, then 5), then one with no limit but the job's
        # timeout-minutes, so three slow mirrors in a row still end green rather than red.
        limits=(120 300 0)
        for attempt in 1 2 3; do
          limit=${limits[attempt - 1]}
          if watched "$limit" update && watched "$limit" install -y --download-only "${pkgs[@]}"; then
            sudo "${apt[@]}" install -y "${pkgs[@]}"
            exit 0
          fi
          echo "::warning::apt download attempt $attempt failed or was stopped"
          if [ -f "$list" ]; then
            current="$(cut -f1 "$list")"
            { tail -n +2 <<< "$current"; head -n 1 <<< "$current"; } | write_list
            echo "Next mirror order:"
            cat "$list"
          fi
        done
        echo "::error::apt could not download the Tauri packages in 3 attempts"
        exit 1
