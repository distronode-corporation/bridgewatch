name: Install cargo-deny
description: The pinned upstream cargo-deny release, checked against its SHA-256.

# Used by ci.yml's `cargo-deny` job and audit.yml's weekly re-run, so the two always
# test with the same binary and a version bump is one edit: the version and its digest
# change together, here and nowhere else. The upstream release checked against a pinned
# SHA-256 rather than a third-party install action, so the org's action allow-list
# stays short. Linux x86_64 runners only (the musl asset).
#
# ⛔ No `uses:` in here, on purpose: dependabot.yml's github-actions entry scans only
# `.github/workflows`, so a pinned action inside a local composite action would never
# be bumped.
runs:
  using: composite
  steps:
    - name: Download, verify and install
      shell: bash
      env:
        CARGO_DENY_VERSION: 0.20.2
        CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      run: |
        set -euo pipefail
        name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
        curl -fsSL -o "$RUNNER_TEMP/deny.tgz" \
          "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
        echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
        tar xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
        install -m 0755 "$RUNNER_TEMP/${name}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
        cargo deny --version
