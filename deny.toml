# cargo-deny policy, run by the `cargo-deny` job in ci.yml (`cargo deny --locked check`).
# Four checks: RustSec advisories, licences, banned crates, allowed sources.

[graph]
# Only the targets a release ships. Without this every Windows-only crate in the
# Tauri tree is judged too, including licences we never distribute.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = true

[advisories]
# Unmaintained notices only for crates this workspace names directly: the Tauri tree
# carries several abandoned transitive crates (proc-macro-error, unic-*, smartstring)
# that we cannot replace, and failing on them would teach everyone to ignore the job.
unmaintained = "workspace"
# Unsound notices for the WHOLE tree, so a new one anywhere is a decision, not noise.
unsound = "all"
# Every vulnerability and unmaintained/unsound notice fails the check unless it is
# listed here, with the reason it is tolerated. Remove an entry the day it can go.
ignore = [
  # glib 0.18 `VariantStrIter` unsoundness (GHSA-wrw7-89jp-8q8g), Linux only. glib
  # reaches us through Tauri 2's GTK 3 stack (gtk-rs 0.18, archived upstream); the fix
  # is glib 0.20, which arrives only when Tauri moves to GTK 4. bridgewatch never
  # calls `VariantStrIter`. The Dependabot alert is dismissed as tolerable risk with
  # the same reason.
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 pinned by Tauri 2 GTK 3; VariantStrIter unused" },
]

[licenses]
# The project is Apache-2.0. Permissive licences only; no copyleft reaches a
# shipped binary. MPL-2.0 is file-level copyleft and compatible with distributing
# an Apache-2.0 binary unmodified.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published to crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace carry no version and are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
