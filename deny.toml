# cargo-deny policy, run by the `cargo-deny` job in ci.yml (`cargo deny --locked check`).
# Four checks: RustSec advisories, licences, banned crates, allowed sources.

[graph]
# Only the targets a release ships. Without this every Windows-only crate in the
# Tauri tree is judged too, including licences we never distribute.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = true

[advisories]
# Unmaintained notices for the WHOLE tree, same as unsound below. The tree carries five
# abandoned transitive crates (proc-macro-error, smartstring, zvariant, zbus_names,
# zvariant_derive) that we cannot replace yet, and one direct one, chrono, kept until it is
# migrated (#106); each is listed by id in `ignore` with the path it arrives by and what
# would retire it, so a SEVENTH abandoned crate anywhere in the tree fails the job and
# becomes a decision. (Five unic-* crates were here too, through
# urlpattern 0.3.0 and tauri-utils 2.9; tauri-utils 2.10 moved to urlpattern 0.6, which
# has none, and they left.)
# ⚠️ This was "workspace" until 2026-09-18, which tolerated those seven by scope and
# recorded nothing. The two cannot be combined: measured with cargo-deny 0.20.2, the
# "workspace" scope never encounters a transitive advisory, so each of the seven entries
# below printed `warning[advisory-not-detected]` on every run, i.e. they were dead lines.
# Under "all" the same entries are what makes the check pass (exit 0, no warnings).
# OpenSSF Scorecard reads OSV through OSV-Scanner, not this file, so osv-scanner.toml
# MIRRORS the seven entries below (same ids, same reasons) for its Vulnerabilities check.
# ⛔ Keep the two lists in step: an entry added or removed here is added or removed there
# in the same change.
unmaintained = "all"
# Unsound notices for the WHOLE tree, so a new one anywhere is a decision, not noise.
unsound = "all"
# Every vulnerability and unmaintained/unsound notice fails the check unless it is
# listed here, with the reason it is tolerated. Remove an entry the day it can go.
ignore = [
  # glib 0.18 `VariantStrIter` unsoundness (GHSA-wrw7-89jp-8q8g), Linux only. glib
  # reaches us through Tauri 2's GTK 3 stack (gtk-rs 0.18, archived upstream); the fix
  # is glib 0.20, which arrives only when Tauri moves to GTK 4. bridgewatch never
  # calls `VariantStrIter`. The Dependabot alert is dismissed as tolerable risk with
  # the same reason.
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 pinned by Tauri 2 GTK 3; VariantStrIter unused" },

  # proc-macro-error 1.0.4 unmaintained, no fixed version. Linux only and build-time only:
  # it is a proc-macro dependency of glib-macros 0.18.5, which arrives through glib 0.18,
  # gtk 0.18, libappindicator, tray-icon and tauri. The same archived gtk-rs 0.18 stack as
  # the glib entry above, so it goes when Tauri moves to GTK 4.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 build-time only, pinned by Tauri 2 GTK 3" },

  # smartstring 1.0.1 unmaintained, no fixed version. The only one here that arrives
  # through a crate this project chose itself: rhai 1.26.1, a direct dependency of
  # bridgewatch-core for the optional `[verdict].script` hook. bridgewatch never names
  # smartstring; it goes when rhai drops or replaces it.
  { id = "RUSTSEC-2026-0249", reason = "smartstring 1.0.1 via rhai 1.26.1, the verdict-script engine" },

  # zvariant 5.9.2, zbus_names 4.3.1, zvariant_derive 5.9.2: unmaintained notices
  # (2026-10-16), not vulnerabilities, and no fixed version: the advisories list none,
  # because the fix is to stop using the standalone crates. Upstream merged all three
  # into zbus 6.0.0 as `zbus::wire`, `zbus::names` and its derive macros, but every
  # zbus 5 release still pulls them. Linux only; bridgewatch never names zbus. zbus 5.13
  # arrives through secret-service 5 (bridgewatch-core's quiet Secret Service read, and
  # keyring 4.2's default store, zbus-secret-service-keyring-store),
  # tauri-plugin-notification (directly and through notify-rust) and
  # tauri-plugin-opener. Checked 2026-11-14: notify-rust 4.19 takes zbus 6 and
  # secret-service has a 6.0.0 release candidate on it, but
  # zbus-secret-service-keyring-store 1.0.1, tauri-plugin-notification 2.8.1 and
  # tauri-plugin-opener 2.7.3 (the latest of each, and the Tauri 3 alphas of both
  # plugins) still require zbus 5, so there is no release to upgrade to yet. They go
  # when those three move and the tree carries only zbus 6 (issue #25). Review by
  # 2027-01-21.
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6), via zbus 5.13 from secret-service, keyring, tauri-plugin-notification, tauri-plugin-opener; not a vulnerability; no zbus 6 release of those yet; replacement tracked in #25; review by 2027-01-21" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6), via zbus 5.13 from secret-service, keyring, tauri-plugin-notification, tauri-plugin-opener; not a vulnerability; no zbus 6 release of those yet; replacement tracked in #25; review by 2027-01-21" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6), via zbus 5.13 from secret-service, keyring, tauri-plugin-notification, tauri-plugin-opener; not a vulnerability; no zbus 6 release of those yet; replacement tracked in #25; review by 2027-01-21" },
  # chrono 0.4.45 unmaintained (RUSTSEC-2026-0543, 2026-11-18), all versions, no fixed
  # release. Unlike the entries above it is a DIRECT dependency, of bridgewatch-core and
  # bridgewatch-app, for API timestamps, ages and the saved state. An unmaintained notice,
  # not a vulnerability. Tolerated now, migrated later (to jiff or time, as the advisory
  # recommends): issue #106. Review by 2027-02-18.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, all versions, no fixed release; a direct dependency of bridgewatch-core and bridgewatch-app; not a vulnerability, no known security issue; migration to jiff or time tracked in #106; review by 2027-02-18" },
]

[licenses]
# The project is Apache-2.0. Permissive licences only; no copyleft reaches a
# shipped binary. MPL-2.0 is file-level copyleft and compatible with distributing
# an Apache-2.0 binary unmodified.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published to crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace carry no version and are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
