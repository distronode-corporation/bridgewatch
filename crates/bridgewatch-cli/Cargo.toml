[package]
name = "bridgewatch-cli"
description = "Command-line bridgewatch: bridge-aware GitLab CI and GitHub Actions verdicts, config tooling and fixture recording. Install with npm (`npm install -g bridgewatch`), from the release tarballs, or with cargo install."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "bridgewatch"
# Not published to crates.io: `bridgewatch` is not a name this project has
# reserved there. The release ships this binary instead, on npm as
# `bridgewatch` and as `bridgewatch-cli_<version>_<target>.tar.gz` assets on
# each GitHub release. The app bundles still do not carry it (there is no
# externalBin), and `cargo install --locked --path crates/bridgewatch-cli`
# builds it from source. Only bridgewatch-core is publishable.
publish = false

[[bin]]
name = "bridgewatch"
path = "src/main.rs"

[dependencies]
bridgewatch-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = { workspace = true }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
schemars = "1.2.2"
toml = "1.1.6"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
