[package]
name = "bridgewatch-core"
description = "Bridge-aware GitLab CI pipeline model, verdict engine and poller. No GUI dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gitlab", "ci", "pipeline", "monitor"]
categories = ["development-tools"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "rt", "macros"] }

async-trait = "0.1.90"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
dirs = "7.0.0"
globset = "0.4.20"
hex = "0.4.3"
keyring = "4.2.0"
minijinja = "2.24.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "charset", "system-proxy"] }
rhai = { version = "1.26.1", features = ["sync", "serde", "no_custom_syntax"] }
schemars = "1.2.2"
toml = "1.1.6"
toml_edit = "0.25.15"
urlencoding = "2.1.3"

[dev-dependencies]
regex = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
async-trait = "0.1.90"
