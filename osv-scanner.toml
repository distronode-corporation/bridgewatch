# OSV-Scanner's ignore list, read by OpenSSF Scorecard's Vulnerabilities check
# and by `osv-scanner scan source -r .`. It MIRRORS deny.toml's [advisories]
# `ignore`: the same eight advisories, the same reasons, and the reasoning for
# each (the path it arrives by and what would retire it) is written there, not
# here. cargo-deny is the gate (CI fails on any advisory not in its list); this
# file only stops Scorecard counting the eight that list already answers.
#
# ⛔ KEEP THE TWO LISTS IN STEP. Add an advisory here only once deny.toml
# ignores it, and remove it here the day it leaves deny.toml. Neither file
# carries an expiry date, so no `ignoreUntil` is set.

